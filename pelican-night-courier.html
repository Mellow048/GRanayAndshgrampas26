<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Night Courier — a pelican on a bike</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0;
    height: 100%;
    background: #070d1c;
    display: grid;
    place-items: center;
    overflow: hidden;
    font-family: ui-rounded, "Segoe UI", system-ui, sans-serif;
  }
  svg.scene {
    width: min(100vw, 177.7vh);
    height: auto;
    display: block;
    border-radius: 14px;
    box-shadow: 0 30px 90px rgba(0, 0, 0, 0.65);
  }

  /* A gentle body bob, twice per pedal revolution. */
  .bob { animation: bob 0.55s ease-in-out infinite; }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-5px); }
  }
  .bob-slow { animation: bob 1.1s ease-in-out infinite; }

  /* Stars breathe. */
  .twinkle { animation: twinkle 3.6s ease-in-out infinite; }
  @keyframes twinkle {
    0%, 100% { opacity: 0.25; }
    50%      { opacity: 1; }
  }

  /* Fireflies drift and pulse. */
  .fly { animation: fly 7s ease-in-out infinite; }
  @keyframes fly {
    0%, 100% { transform: translate(0, 0); opacity: 0.15; }
    35%      { opacity: 0.95; }
    50%      { transform: translate(16px, -22px); opacity: 0.9; }
    75%      { opacity: 0.2; }
  }

  /* Dust kicked up by the back wheel. */
  .puff { animation: puff 1.1s ease-out infinite; transform-origin: center; }
  @keyframes puff {
    0%   { transform: translate(0, 0) scale(0.4); opacity: 0; }
    25%  { opacity: 0.55; }
    100% { transform: translate(-70px, -26px) scale(1.5); opacity: 0; }
  }

  /* The basket fish says hello. */
  .fish-tail { animation: wag 0.9s ease-in-out infinite; transform-box: fill-box; transform-origin: 100% 50%; }
  @keyframes wag {
    0%, 100% { transform: rotate(-14deg); }
    50%      { transform: rotate(14deg); }
  }

  /* Bell shimmer. */
  .ring { animation: ring 2.2s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes ring {
    0%   { opacity: 0.85; transform: scale(0.5); }
    60%  { opacity: 0;    transform: scale(1.5); }
    100% { opacity: 0;    transform: scale(1.5); }
  }

  /* Scarf tail flaps. */
  .flap-a { animation: flap 0.7s ease-in-out infinite; transform-origin: 100% 50%; }
  .flap-b { animation: flap 0.7s ease-in-out infinite 0.12s; transform-origin: 100% 50%; }
  @keyframes flap {
    0%, 100% { transform: rotate(-7deg); }
    50%      { transform: rotate(9deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }
</style>
</head>
<body>
<svg class="scene" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
  <title id="t">The Night Courier</title>
  <desc id="d">A cartoon pelican pedals a red bicycle along a moonlit road, a scarf flapping behind it and a fish in the rear basket.</desc>

  <defs>
    <!-- dusk sky -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#08102a" />
      <stop offset="0.42" stop-color="#17305e" />
      <stop offset="0.72" stop-color="#3c5a8f" />
      <stop offset="0.88" stop-color="#8a6d9b" />
      <stop offset="1"    stop-color="#e0897f" />
    </linearGradient>

    <radialGradient id="moonGlow">
      <stop offset="0"   stop-color="#fff7d2" stop-opacity="0.75" />
      <stop offset="0.45" stop-color="#ffe9a8" stop-opacity="0.22" />
      <stop offset="1"   stop-color="#ffe9a8" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2f45" />
      <stop offset="1" stop-color="#141828" />
    </linearGradient>

    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26375c" />
      <stop offset="1" stop-color="#1a2743" />
    </linearGradient>

    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#182138" />
      <stop offset="1" stop-color="#0e1524" />
    </linearGradient>

    <radialGradient id="lampGlow">
      <stop offset="0"   stop-color="#ffd98a" stop-opacity="0.55" />
      <stop offset="1"   stop-color="#ffd98a" stop-opacity="0" />
    </radialGradient>

    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" />
    </filter>

    <!-- one tile of distant hills, repeated for a seamless scroll -->
    <g id="tileHills">
      <path d="M0 470 Q 120 392 260 452 Q 360 494 470 436 Q 590 372 720 448 Q 840 518 960 442 Q 1080 368 1200 452 L1200 560 L0 560 Z"
            fill="url(#hillFar)" />
      <path d="M0 512 Q 160 462 320 500 Q 470 536 620 496 Q 780 454 940 502 Q 1080 544 1200 506 L1200 600 L0 600 Z"
            fill="url(#hillNear)" />
      <!-- a couple of far off roofs -->
      <g fill="#0b1120" opacity="0.9">
        <path d="M180 500 L180 470 L208 448 L236 470 L236 500 Z" />
        <path d="M846 508 L846 476 L872 454 L898 476 L898 508 Z" />
        <path d="M980 512 L980 486 L1004 466 L1028 486 L1028 512 Z" />
      </g>
    </g>

    <!-- one tile of lamp posts -->
    <g id="tileLamps">
      <g>
        <rect x="198" y="330" width="9" height="216" rx="4" fill="#1b2438" />
        <path d="M202 336 h 44 a 10 10 0 0 1 10 10 v 6" fill="none" stroke="#1b2438" stroke-width="9" stroke-linecap="round" />
        <circle cx="258" cy="368" r="42" fill="url(#lampGlow)" />
        <circle cx="256" cy="356" r="13" fill="#ffdf9e" />
        <path d="M243 344 h 26 l 5 10 h -36 z" fill="#243049" />
      </g>
      <g transform="translate(660 0)">
        <rect x="198" y="330" width="9" height="216" rx="4" fill="#1b2438" />
        <path d="M202 336 h 44 a 10 10 0 0 1 10 10 v 6" fill="none" stroke="#1b2438" stroke-width="9" stroke-linecap="round" />
        <circle cx="258" cy="368" r="42" fill="url(#lampGlow)" />
        <circle cx="256" cy="356" r="13" fill="#ffdf9e" />
        <path d="M243 344 h 26 l 5 10 h -36 z" fill="#243049" />
      </g>
      <g transform="translate(1320 0)">
        <rect x="198" y="330" width="9" height="216" rx="4" fill="#1b2438" />
        <path d="M202 336 h 44 a 10 10 0 0 1 10 10 v 6" fill="none" stroke="#1b2438" stroke-width="9" stroke-linecap="round" />
        <circle cx="258" cy="368" r="42" fill="url(#lampGlow)" />
        <circle cx="256" cy="356" r="13" fill="#ffdf9e" />
        <path d="M243 344 h 26 l 5 10 h -36 z" fill="#243049" />
      </g>
    </g>

    <!-- one tile of roadside grass tufts, fastest parallax -->
    <g id="tileGrass">
      <path d="M40 610 q 8 -30 18 -40 q 2 22 -4 40 z" fill="#12203a" />
      <path d="M150 612 q 6 -22 16 -32 q 0 18 -6 32 z" fill="#16273f" />
      <path d="M330 610 q 10 -34 20 -44 q 2 24 -6 44 z" fill="#12203a" />
      <path d="M470 612 q 6 -20 16 -30 q 0 16 -6 30 z" fill="#16273f" />
      <path d="M640 610 q 9 -32 19 -42 q 2 22 -5 42 z" fill="#12203a" />
      <path d="M790 612 q 6 -22 16 -32 q 0 18 -6 32 z" fill="#16273f" />
      <path d="M940 610 q 10 -34 20 -44 q 2 24 -6 44 z" fill="#12203a" />
      <path d="M1100 612 q 6 -20 16 -30 q 0 16 -6 30 z" fill="#16273f" />
    </g>
  </defs>

  <!-- SKY -->
  <rect width="1200" height="675" fill="url(#sky)" />

  <g id="stars" fill="#fdfbe8">
    <circle cx="84"  cy="62"  r="2.6" class="twinkle" style="animation-delay:0s" />
    <circle cx="150" cy="128" r="1.9" class="twinkle" style="animation-delay:-1.1s" />
    <circle cx="232" cy="48"  r="2.2" class="twinkle" style="animation-delay:-2.3s" />
    <circle cx="300" cy="112" r="1.6" class="twinkle" style="animation-delay:-0.6s" />
    <circle cx="372" cy="58"  r="2.8" class="twinkle" style="animation-delay:-1.8s" />
    <circle cx="452" cy="134" r="1.7" class="twinkle" style="animation-delay:-3.1s" />
    <circle cx="512" cy="70"  r="2.1" class="twinkle" style="animation-delay:-0.9s" />
    <circle cx="596" cy="40"  r="1.8" class="twinkle" style="animation-delay:-2.7s" />
    <circle cx="660" cy="108" r="2.4" class="twinkle" style="animation-delay:-1.4s" />
    <circle cx="726" cy="52"  r="1.6" class="twinkle" style="animation-delay:-3.5s" />
    <circle cx="800" cy="126" r="2.2" class="twinkle" style="animation-delay:-0.3s" />
    <circle cx="866" cy="66"  r="1.9" class="twinkle" style="animation-delay:-2.1s" />
    <circle cx="944" cy="120" r="2.7" class="twinkle" style="animation-delay:-1.6s" />
    <circle cx="1012" cy="46" r="1.7" class="twinkle" style="animation-delay:-3.3s" />
    <circle cx="1088" cy="104" r="2.3" class="twinkle" style="animation-delay:-0.8s" />
    <circle cx="1146" cy="58" r="1.8" class="twinkle" style="animation-delay:-2.5s" />
    <circle cx="196" cy="196" r="1.5" class="twinkle" style="animation-delay:-1.9s" />
    <circle cx="420" cy="184" r="1.4" class="twinkle" style="animation-delay:-2.9s" />
    <circle cx="700" cy="188" r="1.6" class="twinkle" style="animation-delay:-0.5s" />
    <circle cx="980" cy="182" r="1.4" class="twinkle" style="animation-delay:-1.2s" />
  </g>

  <!-- moon -->
  <g>
    <circle cx="990" cy="150" r="190" fill="url(#moonGlow)" />
    <circle cx="990" cy="150" r="76"  fill="#fdf6d8" />
    <circle cx="966" cy="128" r="12"  fill="#f0e5bd" opacity="0.85" />
    <circle cx="1012" cy="172" r="17" fill="#f0e5bd" opacity="0.7" />
    <circle cx="1006" cy="112" r="8"  fill="#f0e5bd" opacity="0.6" />
    <circle cx="948" cy="176" r="7"   fill="#f0e5bd" opacity="0.5" />
  </g>

  <!-- a couple of slow clouds -->
  <g opacity="0.35" fill="#cfe0ff">
    <ellipse cx="260" cy="168" rx="96" ry="24" />
    <ellipse cx="320" cy="152" rx="58" ry="20" />
    <ellipse cx="900" cy="272" rx="120" ry="20" />
    <ellipse cx="966" cy="258" rx="64" ry="16" />
  </g>

  <!-- fireflies -->
  <g fill="#ffe28a">
    <circle cx="180" cy="470" r="4" class="fly" style="animation-delay:-1.2s" />
    <circle cx="330" cy="520" r="3.2" class="fly" style="animation-delay:-3.4s" />
    <circle cx="900" cy="500" r="3.6" class="fly" style="animation-delay:-2.2s" />
    <circle cx="1058" cy="470" r="3" class="fly" style="animation-delay:-4.6s" />
  </g>

  <!-- LAYERS -->
  <!-- distant hills, slow -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-1200 0" dur="26s" repeatCount="indefinite" />
    <use href="#tileHills" />
    <use href="#tileHills" x="1200" />
  </g>

  <!-- lamp posts + road bank, medium -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-1200 0" dur="11s" repeatCount="indefinite" />
    <use href="#tileLamps" />
    <use href="#tileLamps" x="1200" />
  </g>

  <!-- road -->
  <rect x="0" y="545" width="1200" height="130" fill="url(#road)" />
  <line x1="0" y1="549" x2="1200" y2="549" stroke="#465070" stroke-width="3" opacity="0.7" />

  <!-- centre dashes: the dash pattern is 120 long, so scrolling one period loops -->
  <line x1="-200" y1="618" x2="1400" y2="618" stroke="#f4d78a" stroke-width="9"
        stroke-linecap="round" stroke-dasharray="70 50" opacity="0.85">
    <animate attributeName="stroke-dashoffset" from="0" to="-120" dur="0.42s" repeatCount="indefinite" />
  </line>
  <line x1="-200" y1="588" x2="1400" y2="588" stroke="#8e9ab8" stroke-width="3" stroke-dasharray="26 40" opacity="0.35">
    <animate attributeName="stroke-dashoffset" from="0" to="-66" dur="0.28s" repeatCount="indefinite" />
  </line>

  <!-- RIDER -->
  <g class="bob">
    <!-- ground shadow -->
    <ellipse cx="600" cy="552" rx="270" ry="20" fill="#05070f" opacity="0.55" filter="url(#soft)" />

    <!-- dust behind the back wheel -->
    <g fill="#9fb0cc">
      <circle cx="330" cy="520" r="12" class="puff" style="animation-delay:0s" />
      <circle cx="316" cy="534" r="9"  class="puff" style="animation-delay:0.35s" />
      <circle cx="342" cy="540" r="7"  class="puff" style="animation-delay:0.7s" />
    </g>

    <!-- wheels -->
    <g>
      <!-- rear -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 415 460" to="360 415 460" dur="0.9s" repeatCount="indefinite" />
        <circle cx="415" cy="460" r="82" fill="none" stroke="#20263a" stroke-width="13" />
        <circle cx="415" cy="460" r="72" fill="none" stroke="#39425e" stroke-width="4" />
        <g stroke="#8d97b5" stroke-width="2.6" opacity="0.85">
          <line x1="415" y1="382" x2="415" y2="538" />
          <line x1="337" y1="460" x2="493" y2="460" />
          <line x1="360" y1="405" x2="470" y2="515" />
          <line x1="470" y1="405" x2="360" y2="515" />
        </g>
        <circle cx="415" cy="460" r="9" fill="#c9d3ea" stroke="#20263a" stroke-width="3" />
      </g>
      <!-- front -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 770 460" to="360 770 460" dur="0.9s" repeatCount="indefinite" />
        <circle cx="770" cy="460" r="82" fill="none" stroke="#20263a" stroke-width="13" />
        <circle cx="770" cy="460" r="72" fill="none" stroke="#39425e" stroke-width="4" />
        <g stroke="#8d97b5" stroke-width="2.6" opacity="0.85">
          <line x1="770" y1="382" x2="770" y2="538" />
          <line x1="692" y1="460" x2="848" y2="460" />
          <line x1="715" y1="405" x2="825" y2="515" />
          <line x1="825" y1="405" x2="715" y2="515" />
        </g>
        <circle cx="770" cy="460" r="9" fill="#c9d3ea" stroke="#20263a" stroke-width="3" />
      </g>
    </g>

    <!-- frame -->
    <g stroke-linecap="round" fill="none">
      <g stroke="#1b2740" stroke-width="17">
        <path d="M415 460 L 570 462" />
        <path d="M570 462 L 500 350" />
        <path d="M500 350 L 712 336" />
        <path d="M712 336 L 770 460" />
        <path d="M415 460 L 500 350" />
      </g>
      <g stroke="#d94f4f" stroke-width="11">
        <path d="M415 460 L 570 462" />
        <path d="M570 462 L 500 350" />
        <path d="M500 350 L 712 336" />
        <path d="M712 336 L 770 460" />
        <path d="M415 460 L 500 350" />
      </g>
      <!-- crank ring -->
      <circle cx="570" cy="462" r="20" fill="#2a3350" stroke="#0f1524" stroke-width="5" />
      <!-- chain -->
      <path d="M570 442 L 415 460" stroke="#5d688a" stroke-width="4" stroke-dasharray="6 5" />
      <path d="M570 482 L 415 460" stroke="#5d688a" stroke-width="4" stroke-dasharray="6 5" opacity="0.7" />
    </g>

    <!-- saddle -->
    <path d="M462 344 q 24 -16 62 -12 q 18 2 20 12 q -34 12 -82 0 z" fill="#252d44" stroke="#0f1524" stroke-width="4" />

    <!-- handlebar -->
    <g stroke="#1b2740" fill="none" stroke-linecap="round">
      <path d="M712 336 l 0 -22" stroke-width="9" />
      <path d="M676 306 q 36 -14 72 4" stroke-width="9" />
      <path d="M676 306 l -14 10" stroke-width="9" />
      <path d="M748 310 l 14 8" stroke-width="9" />
    </g>
    <!-- bell -->
    <g>
      <circle cx="738" cy="316" r="9" fill="#e8c96a" stroke="#7d6522" stroke-width="2.5" />
      <circle cx="735" cy="313" r="3" fill="#fff3c4" />
      <g fill="none" stroke="#ffe9a8" stroke-width="2.5" stroke-linecap="round" class="ring">
        <path d="M752 306 q 10 -6 16 -2" />
        <path d="M754 320 q 10 6 16 2" />
      </g>
    </g>

    <!-- rear rack + basket -->
    <g>
      <path d="M372 372 h 92" stroke="#1b2740" stroke-width="8" stroke-linecap="round" />
      <path d="M392 372 l -6 40" stroke="#1b2740" stroke-width="6" stroke-linecap="round" />
      <path d="M446 372 l 6 40" stroke="#1b2740" stroke-width="6" stroke-linecap="round" />
      <g transform="translate(360 300)">
        <!-- fish, tail up out of the basket -->
        <g class="fish-tail" style="transform-origin: 62px 44px">
          <path d="M56 50 q 22 -6 34 2 q -12 10 -34 8 z" fill="#6fc3d6" stroke="#1b2740" stroke-width="3" />
        </g>
        <path d="M40 58 q 18 -26 40 -18 q 22 8 26 26 z" fill="#8fd8e8" stroke="#1b2740" stroke-width="3" />
        <circle cx="70" cy="50" r="2.6" fill="#12243a" />
        <!-- basket -->
        <path d="M24 74 h 76 l -8 34 h -60 z" fill="#c98b4b" stroke="#6d4520" stroke-width="4" />
        <g stroke="#a06c34" stroke-width="2.6" opacity="0.9">
          <path d="M30 84 h 64" />
          <path d="M28 94 h 68" />
          <path d="M46 74 l -4 34" />
          <path d="M64 74 l 0 34" />
          <path d="M82 74 l 4 34" />
        </g>
      </g>
    </g>

    <!-- pelican -->
    <g>
      <!-- far leg: shorter, darker, mostly hidden by the body -->
      <g stroke="#b96c22" stroke-width="18" fill="none" stroke-linecap="round" class="bob-slow">
        <path d="M512 328 q 14 30 4 54 q -4 16 6 30" />
      </g>

      <!-- body -->
      <ellipse cx="512" cy="282" rx="88" ry="72" fill="#fdfdff" stroke="#1b2740" stroke-width="5" />
      <!-- chest shading -->
      <path d="M566 232 q 44 44 12 96 q -24 34 -62 24 q 44 -52 50 -120 z" fill="#e9edf8" opacity="0.9" />
      <!-- tail feathers, on the body's trailing edge -->
      <path d="M436 262 q -34 -14 -56 -4 q 20 10 22 24 q 20 -6 34 -4 z" fill="#f4f7ff" stroke="#1b2740" stroke-width="4" stroke-linejoin="round" />
      <path d="M432 292 q -30 4 -46 18 q 22 6 30 14 q 14 -14 16 -32 z" fill="#eef2fb" stroke="#1b2740" stroke-width="4" stroke-linejoin="round" />
      <!-- scarf knotted at the neck, tails streaming behind -->
      <g fill="#e34b4b" stroke="#8e2430" stroke-width="3" stroke-linejoin="round">
        <g class="flap-a" style="transform-origin: 566px 236px">
          <path d="M572 226 q -48 -6 -86 8 q 34 16 86 6 z" />
        </g>
        <g class="flap-b" style="transform-origin: 566px 248px">
          <path d="M570 240 q -42 6 -72 26 q 32 10 72 -4 z" />
        </g>
        <path d="M556 224 q 30 -8 46 4 q -6 16 -26 18 q -16 -6 -20 -22 z" />
      </g>

      <!-- neck -->
      <path d="M556 246 q 26 -42 56 -62 l 44 40 q -30 34 -62 54 z" fill="#fdfdff" stroke="#1b2740" stroke-width="5" stroke-linejoin="round" />

      <!-- head -->
      <circle cx="648" cy="180" r="47" fill="#fdfdff" stroke="#1b2740" stroke-width="5" />
      <!-- crest tuft -->
      <path d="M614 146 q -6 -26 16 -34 q 6 16 2 30 z" fill="#fdfdff" stroke="#1b2740" stroke-width="4" />

      <!-- beak: upper mandible + pouch -->
      <g>
        <path d="M684 166 q 96 -6 176 20 q -80 14 -174 12 z" fill="#ffb347" stroke="#1b2740" stroke-width="5" stroke-linejoin="round" />
        <path d="M690 196 q 70 66 124 52 q 40 -12 46 -46 q -84 20 -170 -6 z" fill="#ffd08a" stroke="#1b2740" stroke-width="5" stroke-linejoin="round" />
        <path d="M700 200 q 74 46 118 34" fill="none" stroke="#d99a4a" stroke-width="3" opacity="0.7" />
      </g>

      <!-- eye -->
      <g>
        <ellipse cx="662" cy="168" rx="8.5" ry="9" fill="#1b1b1b">
          <animate attributeName="ry" values="9;9;1.2;9;9" keyTimes="0;0.88;0.93;0.98;1" dur="5.2s" repeatCount="indefinite" />
        </ellipse>
        <circle cx="665" cy="164" r="3" fill="#ffffff" />
      </g>

      <!-- near wing, reaching forward to the handlebar -->
      <g>
        <path d="M556 246 q 62 8 104 58 q 22 24 52 26"
              fill="none" stroke="#1b2740" stroke-width="36" stroke-linecap="round" />
        <path d="M556 246 q 62 8 104 58 q 22 24 52 26"
              fill="none" stroke="#f2f5fd" stroke-width="28" stroke-linecap="round" />
        <path d="M596 276 q 40 16 66 46 q 12 14 30 18"
              fill="none" stroke="#cfd7ea" stroke-width="4" opacity="0.85" />
        <!-- feather tips -->
        <path d="M690 322 q 18 12 34 12 q -6 -18 -22 -26 z" fill="#f2f5fd" stroke="#1b2740" stroke-width="3.5" stroke-linejoin="round" />
        <circle cx="724" cy="330" r="12" fill="#fdfdff" stroke="#1b2740" stroke-width="4" />
      </g>

      <!-- near leg: hip, knee, ankle, all the way down to the pedal -->
      <g stroke="#f39c3d" stroke-width="22" fill="none" stroke-linecap="round" class="bob-slow">
        <path d="M536 330 q 30 24 34 56 q 2 22 26 44" />
      </g>
      <path d="M536 330 q 30 24 34 56 q 2 22 26 44" fill="none" stroke="#d3832c" stroke-width="6" opacity="0.35" stroke-linecap="round" />
    </g>

    <!-- cranks, pedals and feet -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 570 462" to="360 570 462" dur="1.1s" repeatCount="indefinite" />
      <!-- arms -->
      <line x1="570" y1="462" x2="604" y2="462" stroke="#20263a" stroke-width="9" stroke-linecap="round" />
