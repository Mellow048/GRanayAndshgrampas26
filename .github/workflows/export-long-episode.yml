name: Export Long POV Episode (Chunked Parallel Cloud Render)

on:
  workflow_dispatch:
    inputs:
      preset:
        description: "Episode preset to split & render in parallel"
        type: choice
        default: "comedy_variety_1m"
        options:
          - comedy_variety_1m
          - golden_pizza_shenanigans_4m
          - cookie_marathon_150s
          - rocket_ball_x3
          - the_great_escape_68s
          - mountain_dew_run
          - breakfast_surprise_20s
          - custom_json
      episode_json:
        description: "Custom Episode JSON (overrides preset if provided)"
        type: string
        required: false
        default: ""
      max_chunk_sec:
        description: "Max seconds per parallel chunk (snaps cleanly to gag boundaries)"
        type: string
        default: "180"
      aspect:
        description: "Aspect ratio override (auto uses the episode's own aspect)"
        type: choice
        default: "auto"
        options:
          - auto
          - "16:9"
          - "9:16"
      fps:
        description: "Output frame rate"
        type: choice
        default: "30"
        options:
          - "24"
          - "30"
          - "60"
      sfx_pacer:
        description: "Enable Cartoon SFX Pacer"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.chunk.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Audit Episode & Split into Gag-Aligned Chunks
        id: chunk
        env:
          EPISODE_JSON: ${{ inputs.episode_json }}
        run: |
          if [ -n "$EPISODE_JSON" ]; then
            printf '%s' "$EPISODE_JSON" > /tmp/custom_episode.json
            node scripts/validate-episode.mjs --file /tmp/custom_episode.json
            node scripts/chunk-episode.mjs --episode-file /tmp/custom_episode.json --max-chunk-sec "${{ inputs.max_chunk_sec }}" --out-dir chunks --github-matrix
          else
            node scripts/validate-episode.mjs --preset "${{ inputs.preset }}"
            node scripts/audit-pacing.mjs "${{ inputs.preset }}"
            node scripts/chunk-episode.mjs --preset "${{ inputs.preset }}" --max-chunk-sec "${{ inputs.max_chunk_sec }}" --out-dir chunks --github-matrix
          fi

      - name: Upload Chunk JSONs
        uses: actions/upload-artifact@v4
        with:
          name: chunk-manifests-${{ github.run_id }}
          path: chunks/

  render-chunk:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium

      - name: Install Playwright & Three.js (ephemeral)
        run: |
          npm install --no-save playwright three@0.170.0
          npx playwright install chromium
          npx playwright install-deps chromium

      - name: Download Chunk JSONs
        uses: actions/download-artifact@v4
        with:
          name: chunk-manifests-${{ github.run_id }}
          path: chunks

      - name: Render Chunk ${{ matrix.chunk }}
        run: |
          ASPECT_ARG=""
          if [ "${{ inputs.aspect }}" != "auto" ]; then
            ASPECT_ARG="--aspect ${{ inputs.aspect }}"
          fi
          node scripts/export-video.mjs \
            --episode-file "chunks/chunk_${{ matrix.chunk }}.json" \
            --fps "${{ inputs.fps }}" \
            --pacer "${{ inputs.sfx_pacer }}" \
            --format mp4 \
            --out-name "chunk_${{ matrix.chunk }}" \
            $ASPECT_ARG \
            --out-dir rendered_chunk

      - name: Upload Rendered Chunk
        uses: actions/upload-artifact@v4
        with:
          name: chunk-video-${{ github.run_id }}-${{ matrix.chunk }}
          # The renderer slugs its --out-name, so "chunk_000" is written as
          # chunk-000-<aspect>-<fps>fps.mp4. Matching the exact un-slugged name
          # silently uploaded an empty artifact and cost two full renders.
          path: rendered_chunk/*.mp4
          if-no-files-found: error

  probe:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium

      - name: Install Playwright & Three.js (ephemeral)
        run: |
          npm install --no-save playwright three@0.170.0
          npx playwright install chromium
          npx playwright install-deps chromium

      # Same body as the per-chunk render, walked without rendering: proves the
      # lens never ends up inside a table or a performer before we spend an hour
      # of GPU time on frames nobody can watch.
      - name: Lens clearance probe (no render)
        env:
          EPISODE_JSON: ${{ inputs.episode_json }}
        run: |
          ASPECT_ARG=""
          if [ "${{ inputs.aspect }}" != "auto" ]; then
            ASPECT_ARG="--aspect ${{ inputs.aspect }}"
          fi
          node scripts/export-video.mjs \
            --preset "${{ inputs.preset }}" \
            --fps "${{ inputs.fps }}" \
            --probe \
            $ASPECT_ARG \
            --out-dir probe

      - name: Upload probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lens-probe-${{ github.run_id }}
          path: probe/probe-report.json
          if-no-files-found: warn

  stitch:
    needs: [render-chunk, probe]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download All Rendered Chunks
        uses: actions/download-artifact@v4
        with:
          pattern: chunk-video-${{ github.run_id }}-*
          path: rendered_chunks
          merge-multiple: true

      - name: Lossless FFmpeg Stitch
        run: |
          echo "== downloaded chunks =="
          find rendered_chunks -type f -printf '  %p  %s bytes\n' | head -40
          mkdir -p output
          # Stream-copy first (no quality loss). If the chunks disagree on stream
          # parameters, re-encode. If a single chunk came back, just take it.
          node scripts/export-video.mjs --concat rendered_chunks --out-name "${{ inputs.preset }}-full" --out-dir output \
            || node scripts/export-video.mjs --concat rendered_chunks --reencode --out-name "${{ inputs.preset }}-full" --out-dir output \
            || true
          if ! ls output/*.mp4 >/dev/null 2>&1; then
            single=$(find rendered_chunks -type f -name '*.mp4' | head -1)
            if [ -n "$single" ]; then
              echo "Single-chunk render, copying $single"
              cp "$single" "output/${{ inputs.preset }}-full.mp4"
            fi
          fi
          echo "== stitched output =="
          ls -la output
          ls output/*.mp4 >/dev/null 2>&1 || { echo "::error::no stitched video produced"; exit 1; }

      - name: Upload stitched MP4 artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: final-video-${{ github.run_id }}
          path: output/*.mp4
          if-no-files-found: error

      # A release asset gives the video a stable public URL instead of an
      # artifact that only people signed in to GitHub can download.
      - name: Publish to latest-export release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-export
          name: Latest export
          body: "${{ inputs.preset }} — stitched from ${{ inputs.max_chunk_sec }}s parallel chunks."
          files: output/*.mp4
          fail_on_unmatched_files: false

      - name: Upload Full Stitched Episode
        uses: actions/upload-artifact@v4
        with:
          name: granny-pov-full-${{ inputs.preset }}-${{ github.run_number }}
          path: output/*.mp4
