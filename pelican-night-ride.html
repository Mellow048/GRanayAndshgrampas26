<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Night Ride — a pelican on a bicycle</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-content: center;
        justify-items: center;
        padding: 30px 18px;
        background: #06090f;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        color: #8fa3bf;
      }
      .card {
        width: min(1140px, 100%);
        border-radius: 22px;
        overflow: hidden;
        background: #0d1730;
        box-shadow:
          0 40px 90px -30px rgba(0, 0, 0, 0.95),
          0 0 0 1px rgba(150, 180, 220, 0.12),
          0 0 120px -50px rgba(120, 200, 255, 0.35);
      }
      svg {
        display: block;
        width: 100%;
        height: auto;
      }
      .caption {
        width: min(1140px, 100%);
        margin: 15px 2px 0;
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        font-size: 12px;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }
      .caption strong {
        color: #d6e2f2;
        font-weight: 600;
      }
      .caption span {
        color: #59708c;
      }

      /* ── ambience: twinkling stars, drifting fireflies, tyre dust ── */
      @keyframes twinkle {
        0%,
        100% {
          opacity: 0.25;
        }
        50% {
          opacity: 1;
        }
      }
      .tw {
        animation: twinkle 3.4s ease-in-out infinite;
      }
      .tw:nth-of-type(2n) {
        animation-duration: 4.6s;
        animation-delay: 0.7s;
      }
      .tw:nth-of-type(3n) {
        animation-duration: 2.7s;
        animation-delay: 1.4s;
      }
      @keyframes fly {
        0% {
          transform: translate(0, 0);
          opacity: 0.15;
        }
        25% {
          opacity: 0.9;
        }
        50% {
          transform: translate(26px, -20px);
          opacity: 0.5;
        }
        75% {
          opacity: 0.95;
        }
        100% {
          transform: translate(6px, -38px);
          opacity: 0.15;
        }
      }
      .fly {
        animation: fly 6s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
      .fly:nth-of-type(2n) {
        animation-duration: 7.5s;
        animation-delay: 0.9s;
      }
      .fly:nth-of-type(3n) {
        animation-duration: 5.2s;
        animation-delay: 1.8s;
      }
      @keyframes puff {
        0% {
          opacity: 0;
          transform: translate(0, 0) scale(0.4);
        }
        20% {
          opacity: 0.3;
        }
        100% {
          opacity: 0;
          transform: translate(-70px, -14px) scale(1.6);
        }
      }
      .puff {
        animation: puff 2.4s ease-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
      .puff:nth-of-type(2) {
        animation-delay: 0.6s;
      }
      .puff:nth-of-type(3) {
        animation-delay: 1.2s;
      }
      @media (prefers-reduced-motion: reduce) {
        .tw,
        .fly,
        .puff {
          animation: none;
        }
        .puff {
          opacity: 0;
        }
      }
    </style>
  </head>

    <p class="caption">
      <strong>Night Ride — Pelican on a Bike</strong>
      <span>two-bone IK pedalling · hand-built svg · no libraries</span>
    </p>

    <script>
      (() => {
        "use strict";
        const $ = (id) => document.getElementById(id);
        const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        const parts = {};
        [
          "rig", "bill", "eyelid", "roadLine", "spokesRear", "spokesFront", "beamGroup",
          "nearLeg", "nearLegInk", "nearFoot", "nearPedal", "nearCrank",
          "farLeg", "farLegInk", "farFoot", "farPedal", "farCrank"
        ].forEach((id) => (parts[id] = $(id)));

        /* rig geometry, in viewBox units */
        const BB = { x: 556, y: 630 };
        const CRANK = 50;
        const HIP_NEAR = { x: 590, y: 452 };
        const HIP_FAR = { x: 568, y: 452 };
        const THIGH = 104;
        const SHIN = 132;
        const CADENCE = 1.05;
        const GEAR = 1.3;
        const ROAD_SPEED = 120;

        /* two-bone IK; the perpendicular is picked so the knee bends forward */
        function kneeOf(hip, foot) {
          const dx = foot.x - hip.x;
          const dy = foot.y - hip.y;
          const raw = Math.hypot(dx, dy) || 1;
          const ux = dx / raw;
          const uy = dy / raw;
          const d = Math.min(Math.max(raw, Math.abs(THIGH - SHIN) + 1), THIGH + SHIN - 1);
          const a = (THIGH * THIGH - SHIN * SHIN + d * d) / (2 * d);
          const h = Math.sqrt(Math.max(0, THIGH * THIGH - a * a));
          return { x: hip.x + a * ux + h * uy, y: hip.y + a * uy - h * ux };
        }

        const f1 = (n) => n.toFixed(1);

        function limb(inkEl, fillEl, hip, foot) {
          const k = kneeOf(hip, foot);
          const d =
            "M " + f1(hip.x) + "," + f1(hip.y) +
            " L " + f1(k.x) + "," + f1(k.y) +
            " L " + f1(foot.x) + "," + f1(foot.y);
          inkEl.setAttribute("d", d);
          fillEl.setAttribute("d", d);
        }

        const at = (el, x, y) => el.setAttribute("transform", "translate(" + f1(x) + "," + f1(y) + ")");

        const t0 = performance.now();
        let raf = 0;

        function frame(now) {
          const t = (now - t0) / 1000;
          const theta = t * Math.PI * 2 * CADENCE;
          const bob = Math.sin(theta * 2) * 2;

          const near = { x: BB.x + Math.cos(theta) * CRANK, y: BB.y + Math.sin(theta) * CRANK };
          const far = { x: BB.x - Math.cos(theta) * CRANK, y: BB.y - Math.sin(theta) * CRANK };

          const hipN = { x: HIP_NEAR.x, y: HIP_NEAR.y + bob };
          const hipF = { x: HIP_FAR.x, y: HIP_FAR.y + bob };

          limb(parts.nearLeg, parts.nearLegInk, hipN, near);
          limb(parts.farLeg, parts.farLegInk, hipF, far);

          at(parts.nearFoot, near.x, near.y);
          at(parts.farFoot, far.x, far.y);
          at(parts.nearPedal, near.x, near.y);
          at(parts.farPedal, far.x, far.y);

          parts.nearCrank.setAttribute("x2", f1(near.x));
          parts.nearCrank.setAttribute("y2", f1(near.y));
          parts.farCrank.setAttribute("x2", f1(far.x));
          parts.farCrank.setAttribute("y2", f1(far.y));

          parts.rig.setAttribute("transform", "translate(0 " + f1(bob) + ")");

          const deg = (t * 360 * CADENCE * GEAR) % 360;
          parts.spokesRear.setAttribute("transform", "rotate(" + f1(deg) + " 392 608)");
          parts.spokesFront.setAttribute("transform", "rotate(" + f1(deg) + " 792 608)");

          parts.roadLine.setAttribute("stroke-dashoffset", f1(-((t * ROAD_SPEED) % 174)));

          const swing = Math.sin(theta * 2 + 0.5) * 1.3;
          parts.bill.setAttribute("transform", "rotate(" + f1(swing) + " 736 246)");

          /* lamp: a faint unsteady flicker, like a hub dynamo at low speed */
          const flick = 0.94 + 0.06 * Math.sin(t * 9.3) * Math.sin(t * 3.1);
          parts.beamGroup.setAttribute("opacity", f1(flick * 100) / 100);

          const cyc = 5.2;
          parts.eyelid.setAttribute("opacity", t % cyc > cyc - 0.12 ? "1" : "0");

          raf = requestAnimationFrame(frame);
        }

        const kick = () => {
          cancelAnimationFrame(raf);
          raf = requestAnimationFrame(frame);
        };

        if (!reduced) {
          kick();
          document.addEventListener("visibilitychange", () => {
            if (document.hidden) cancelAnimationFrame(raf);
            else kick();
          });
        }
      })();
    </script>
