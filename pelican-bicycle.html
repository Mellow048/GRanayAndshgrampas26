<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pelican on a Bicycle — pure SVG</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    place-items: center;
    padding: clamp(10px, 3vw, 34px);
    background: radial-gradient(130% 120% at 50% 0%, #17343f 0%, #0b1a21 55%, #060e12 100%);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .stage { width: min(1180px, 100%, calc((100vh - 68px) * 1.4286)); }
  svg {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 22px;
    box-shadow: 0 26px 70px rgba(0, 0, 0, .55), 0 0 0 1px rgba(255, 255, 255, .07);
  }

  .cloud-a { animation: drift 52s linear infinite; }
  .cloud-b { animation: drift 34s linear infinite; animation-delay: -12s; }
  .cloud-c { animation: drift 70s linear infinite; animation-delay: -30s; }

  #roadDashes { animation: roll 1.15s linear infinite; }

  #scarfTails {
    transform-origin: 420px 164px;
    animation: flutter 1.15s ease-in-out infinite;
  }

  .speedline { animation: whoosh 1.3s linear infinite; }
  .speedline:nth-child(2) { animation-delay: .26s; }
  .speedline:nth-child(3) { animation-delay: .55s; }

  #eye { transform-origin: 512px 118px; animation: blink 6.4s ease-in-out infinite; }

  @keyframes drift   { from { transform: translateX(70px); } to { transform: translateX(-280px); } }
  @keyframes roll    { from { transform: translateX(0); }    to { transform: translateX(-152px); } }
  @keyframes flutter { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(5deg); } }
  @keyframes whoosh  { 0% { transform: translateX(36px); opacity: 0; }
                       25% { opacity: .75; }
                       100% { transform: translateX(-84px); opacity: 0; } }
  @keyframes blink   { 0%, 93%, 100% { transform: scaleY(1); }
                       95%, 97% { transform: scaleY(.08); } }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }
</style>
</head>
<body>
<main class="stage">
  <svg id="art" viewBox="0 0 1000 700" role="img" aria-labelledby="artTitle artDesc" xmlns="http://www.w3.org/2000/svg">
    <title id="artTitle">A pelican riding a bicycle</title>
    <desc id="artDesc">A hand-drawn SVG seaside scene: a white pelican in a red helmet and scarf pedals a teal bicycle along a coastal road, with a basket of fish on the handlebars.</desc>

    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#4fa9dd" />
        <stop offset=".5" stop-color="#a3d8f0" />
        <stop offset="1" stop-color="#ffe9c8" />
      </linearGradient>
      <radialGradient id="sunGlow">
        <stop offset="0" stop-color="#fff8dd" stop-opacity=".95" />
        <stop offset=".42" stop-color="#ffe3a4" stop-opacity=".45" />
        <stop offset="1" stop-color="#ffe3a4" stop-opacity="0" />
      </radialGradient>
      <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#3d90b6" />
        <stop offset="1" stop-color="#82c8da" />
      </linearGradient>
      <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#5c636b" />
        <stop offset=".45" stop-color="#454c53" />
        <stop offset="1" stop-color="#2e343a" />
      </linearGradient>
      <linearGradient id="body" x1=".12" y1=".05" x2=".8" y2="1">
        <stop offset="0" stop-color="#ffffff" />
        <stop offset=".5" stop-color="#f4f8fa" />
        <stop offset="1" stop-color="#c7d5e0" />
      </linearGradient>
      <linearGradient id="wing" x1=".1" y1="0" x2=".85" y2="1">
        <stop offset="0" stop-color="#eef4f8" />
        <stop offset="1" stop-color="#b0c4d4" />
      </linearGradient>
      <linearGradient id="beak" x1="0" y1="0" x2=".4" y2="1">
        <stop offset="0" stop-color="#ffd463" />
        <stop offset=".55" stop-color="#f7a52a" />
        <stop offset="1" stop-color="#dd7f14" />
      </linearGradient>
      <linearGradient id="pouch" x1=".2" y1="0" x2=".5" y2="1">
        <stop offset="0" stop-color="#ffd783" />
        <stop offset=".55" stop-color="#f9b247" />
        <stop offset="1" stop-color="#e5902a" />
      </linearGradient>
      <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#3fd6c4" />
        <stop offset=".5" stop-color="#16a6ab" />
        <stop offset="1" stop-color="#0b6f7c" />
      </linearGradient>
      <linearGradient id="helmet" x1=".2" y1="0" x2=".7" y2="1">
        <stop offset="0" stop-color="#ff7a5c" />
        <stop offset=".55" stop-color="#e8462c" />
        <stop offset="1" stop-color="#b62e1d" />
      </linearGradient>
      <linearGradient id="scarf" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ff7b58" />
        <stop offset="1" stop-color="#c8331d" />
      </linearGradient>
      <linearGradient id="scarf2" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ff9070" />
        <stop offset="1" stop-color="#d4452c" />
      </linearGradient>
      <radialGradient id="shadow">
        <stop offset="0" stop-color="#0a1116" stop-opacity=".45" />
        <stop offset=".7" stop-color="#0a1116" stop-opacity=".18" />
        <stop offset="1" stop-color="#0a1116" stop-opacity="0" />
      </radialGradient>
      <radialGradient id="vignette" cx=".5" cy=".45" r=".78">
        <stop offset=".62" stop-color="#06131a" stop-opacity="0" />
        <stop offset="1" stop-color="#06131a" stop-opacity=".26" />
      </radialGradient>
      <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">

        <stop offset="1" stop-color="#fff3d8" stop-opacity="0" />
      </linearGradient>
      <filter id="soft" x="-30%" y="-60%" width="160%" height="220%">

      <!-- one reusable wheel, spun by JS -->

          <line x1="0" y1="0" x2="0" y2="-64" transform="rotate(60)" />
          <line x1="0" y1="0" x2="0" y2="-64" transform="rotate(90)" />
          <line x1="0" y1="0" x2="0" y2="-64" transform="rotate(120)" />
          <line x1="0" y1="0" x2="0" y2="-64" transform="rotate(150)" />
          <line x1="0" y1="0" x2="0" y2="-64" transform="rotate(180)" />
          <line x1="0" y1="0" x2="0" y2="-64" transform="rotate(210)" />
          <line x1="0" y1="0" x2="0" y2="-64" transform="rotate(240)" />
          <line x1="0" y1="0" x2="0" y2="-64" transform="rotate(270)" />

        <circle r="11" fill="#38424b" stroke="#d3dde4" stroke-width="3" />

        <rect x="4" y="-76" width="9" height="11" rx="2.5" fill="#f0a03a" transform="rotate(24)" />
      </g>

      <clipPath id="roadClip"><rect x="0" y="520" width="1000" height="180" /></clipPath>
      <clipPath id="seaClip"><rect x="0" y="400" width="1000" height="68" /></clipPath>
    </defs>

    <!-- ============ SKY ============ -->
    <rect width="1000" height="700" fill="url(#sky)" />

    <circle cx="866" cy="100" r="50" fill="#fff5d6" />

    <g fill="#ffffff" opacity=".92">

    <!-- gulls -->

    <!-- far shore: sailboat + lighthouse -->
    <g>
      <g transform="translate(158 402)">
        <path d="M -24 0 L 24 0 L 15 11 L -15 11 Z" fill="#f4efe2" />

          <path d="M -9.5 24 L 9.5 24 L 8.5 13 L -8.5 13 Z" fill="#e2725f" />
          <rect x="-11" y="-8" width="22" height="10" rx="2" fill="#4d5b62" />
          <rect x="-6.5" y="-19" width="13" height="12" rx="2" fill="#fff2c4" />
          <path d="M -9 -19 L 9 -19 L 0 -29 Z" fill="#4d5b62" />
          <circle cx="0" cy="-13.5" r="3.4" fill="#ffd766" />
          <path d="M 9 -15 L 52 -26 L 52 -2 Z" fill="#ffe9a8" opacity=".28" />
          <path d="M -9 -15 L -52 -26 L -52 -2 Z" fill="#ffe9a8" opacity=".18" />

      </g>
    </g>
    <rect x="0" y="466" width="1000" height="4" fill="#f0e3c8" opacity=".55" />

    <!-- ============ PROMENADE + RAILING ============ -->

    <rect x="0" y="468" width="1000" height="5" fill="#cdbb97" opacity=".8" />
    <g stroke="#cdbb97" stroke-width="2" opacity=".45">
      <path d="M 0 502 h 1000 M 0 516 h 1000" />

    <g>

    <!-- ============ ROAD ============ -->

    <g id="roadDashes" stroke="#f4e8c9" stroke-width="11" stroke-linecap="round" opacity=".9">

      <line x1="176" y1="654" x2="280" y2="654" />
      <line x1="328" y1="654" x2="432" y2="654" />

      <line x1="936" y1="654" x2="1040" y2="654" />
    </g>

    <!-- foreground speed lines -->

      <line class="speedline" x1="26" y1="330" x2="88" y2="330" />
      <line class="speedline" x1="10" y1="372" x2="74" y2="372" />
      <line class="speedline" x1="38" y1="414" x2="96" y2="414" />
    </g>

    <!-- contact shadows -->
    <g filter="url(#soft)">
      <ellipse cx="470" cy="586" rx="255" ry="20" fill="url(#shadow)" />
      <ellipse cx="285" cy="582" rx="86" ry="12" fill="#0a1116" opacity=".28" />
      <ellipse cx="645" cy="582" rx="86" ry="12" fill="#0a1116" opacity=".28" />
    </g>

    <!-- ============ BICYCLE ============ -->

        <path id="legFarShin" d="M464 335 L413 466" stroke="#c97615" stroke-width="10" />

        <path d="M 0 -3 C 11 -8, 24 -4, 33 0" fill="none" stroke="#a55a12" stroke-width="1.6" />
      </g>

      <g id="pedalFar" transform="translate(413 466)">
        <rect x="-17" y="-5" width="34" height="10" rx="3.5" fill="#39424a" />

      <!-- fork -->

      <path d="M 582 356 C 590 384, 600 412, 612 434" stroke="#7df0df" stroke-width="3" fill="none" opacity=".5" stroke-linecap="round" />

      <circle cx="572" cy="259" r="8.5" fill="#f3c34d" stroke="#a87c1c" stroke-width="2.5" />
      <circle cx="569.5" cy="256" r="2.6" fill="#fff3c4" />
      <path d="M 606 268 C 612 280, 604 291, 592 293" stroke="#cbd5dd" stroke-width="4.5" fill="none" stroke-linecap="round" />
      <path d="M 552 294 C 516 294, 470 302, 378 316" stroke="#232b31" stroke-width="2.4" fill="none" opacity=".55" />
      <path d="M 606 268 C 610 320, 622 364, 633 404" stroke="#232b31" stroke-width="2.4" fill="none" opacity=".4" />

      <!-- chainring + near crank -->

    <!-- ============ PELICAN ============ -->
    <g id="rider">

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)');

  // --- rig constants -------------------------------------------------------
  const BB = { x: 435, y: 500 };
  const CRANK = 40;
  const HIP_NEAR = [378, 292];
  const HIP_FAR  = [362, 286];
  const L_THIGH = 136;
  const L_SHIN  = 142;
  const CADENCE = 0.8;
  const ANGLE0  = 1.0;
  const WHEEL_REAR  = { x: 285, y: 500 };
  const WHEEL_FRONT = { x: 645, y: 500 };

  const els = {
    rear: $('rearWheel'), front: $('frontWheel'), ring: $('chainring'),
    armN: $('crankNear'), armNin: $('crankNearInk'), armF: $('crankFar'),
    pedalN: $('pedalNear'), pedalF: $('pedalFar'),
    footN: $('footNear'), footF: $('footFar'),
    thighN: $('legNearThigh'), shinN: $('legNearShin'), kneeN: $('kneeNear'),
    thighNi: $('legNearThighInk'), shinNi: $('legNearShinInk'), kneeNi: $('kneeNearInk'),
    thighF: $('legFarThigh'), shinF: $('legFarShin'),
    thighFi: $('legFarThighInk'), shinFi: $('legFarShinInk'),
    rider: $('rider')
  };

  // two-bone IK so the feet stay welded to the spinning pedals
  function solveKnee(hx, hy, px, py) {
    let dx = px - hx, dy = py - hy;
    let d = Math.hypot(dx, dy) || 1;
    const reach = L_THIGH + L_SHIN - 0.4;
    if (d > reach) { dx *= reach / d; dy *= reach / d; d = reach; }
    if (d < 1) d = 1;
    const ux = dx / d, uy = dy / d;
    const a = (L_THIGH * L_THIGH - L_SHIN * L_SHIN + d * d) / (2 * d);
    const h = Math.sqrt(Math.max(0, L_THIGH * L_THIGH - a * a));
    return {
      kx: hx + ux * a + uy * h,
      ky: hy + uy * a - ux * h,
      px: hx + dx,
      py: hy + dy
    };
  }

  function placeLeg(thighEl, shinEl, footEl, hip, pedal, kneeEl, thighInk, shinInk, kneeInk) {
    const j = solveKnee(hip[0], hip[1], pedal.x, pedal.y);
    const thigh = `M${hip[0]} ${hip[1]} L${j.kx.toFixed(1)} ${j.ky.toFixed(1)}`;
    const shin = `M${j.kx.toFixed(1)} ${j.ky.toFixed(1)} L${j.px.toFixed(1)} ${j.py.toFixed(1)}`;
    thighEl.setAttribute('d', thigh);
    shinEl.setAttribute('d', shin);
    if (thighInk) thighInk.setAttribute('d', thigh);
    if (shinInk) shinInk.setAttribute('d', shin);
    footEl.setAttribute('transform', `translate(${j.px.toFixed(1)} ${(j.py - 7).toFixed(1)})`);
    for (const disc of [kneeEl, kneeInk]) {
      if (!disc) continue;
      disc.setAttribute('cx', j.kx.toFixed(1));
      disc.setAttribute('cy', j.ky.toFixed(1));
    }
  }

  let clock = 0;
  let last = 0;

  function render(now) {
    if (!last) last = now;
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!reduce.matches) clock += dt;

    const ang = ANGLE0 + clock * Math.PI * 2 * CADENCE;
    const deg = ang * 180 / Math.PI;
    const spin = deg * 3.3;

    const pedalN = { x: BB.x + CRANK * Math.cos(ang), y: BB.y + CRANK * Math.sin(ang) };
    const pedalF = { x: BB.x - CRANK * Math.cos(ang), y: BB.y - CRANK * Math.sin(ang) };

    els.rear.setAttribute('transform', `translate(${WHEEL_REAR.x} ${WHEEL_REAR.y}) rotate(${spin.toFixed(1)})`);
    els.front.setAttribute('transform', `translate(${WHEEL_FRONT.x} ${WHEEL_FRONT.y}) rotate(${(spin * 1.04).toFixed(1)})`);

    els.ring.setAttribute('transform', `rotate(${deg.toFixed(1)})`);
    for (const arm of [els.armN, els.armNin]) {
      arm.setAttribute('x1', BB.x); arm.setAttribute('y1', BB.y);
      arm.setAttribute('x2', pedalN.x.toFixed(1));
      arm.setAttribute('y2', pedalN.y.toFixed(1));
    }
    els.armF.setAttribute('x1', BB.x); els.armF.setAttribute('y1', BB.y);
    els.armF.setAttribute('x2', pedalF.x.toFixed(1));
    els.armF.setAttribute('y2', pedalF.y.toFixed(1));
    els.pedalN.setAttribute('transform', `translate(${pedalN.x.toFixed(1)} ${pedalN.y.toFixed(1)})`);
    els.pedalF.setAttribute('transform', `translate(${pedalF.x.toFixed(1)} ${pedalF.y.toFixed(1)})`);

    placeLeg(els.thighN, els.shinN, els.footN, HIP_NEAR, pedalN, els.kneeN, els.thighNi, els.shinNi, els.kneeNi);
    placeLeg(els.thighF, els.shinF, els.footF, HIP_FAR, pedalF, null, els.thighFi, els.shinFi, null);

    const bob = Math.sin(clock * Math.PI * 2 * CADENCE * 2) * 1.9;
    els.rider.setAttribute('transform', `translate(0 ${bob.toFixed(2)})`);

    if (!reduce.matches) requestAnimationFrame(render);
  }

  requestAnimationFrame(render);
})();
</script>
