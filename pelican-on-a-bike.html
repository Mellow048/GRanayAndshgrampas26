<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pelican on a Bike — SVG</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-content: center;
        justify-items: center;
        padding: 32px 18px;
        background:
          radial-gradient(120% 90% at 50% -10%, #2b3d4f 0%, #16212c 55%, #0b1117 100%);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        color: #a9bdcd;
      }
      .card {
        width: min(1120px, 100%);
        border-radius: 24px;
        overflow: hidden;
        background: #bfe9f0;
        box-shadow:
          0 40px 80px -30px rgba(0, 0, 0, 0.85),
          0 0 0 1px rgba(255, 255, 255, 0.09),
          0 0 90px -30px rgba(120, 220, 235, 0.35);
      }
      svg {
        display: block;
        width: 100%;
        height: auto;
      }
      .caption {
        width: min(1120px, 100%);
        margin: 16px 2px 0;
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 18px;
        flex-wrap: wrap;
        font-size: 12px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      .caption strong {
        color: #e8f2f8;
        font-weight: 600;
      }
      .caption span {
        color: #748b9c;
      }

      /* ── gentle motion ───────────────────────────────────────────── */
      @keyframes bob {
        0%,
        100% {
          transform: translateY(0) rotate(0deg);
        }
        50% {
          transform: translateY(-4px) rotate(0.35deg);
        }
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes roadRun {
        to {
          stroke-dashoffset: 320;
        }
      }
      @keyframes windRun {
        to {
          stroke-dashoffset: 260;
        }
      }
      @keyframes puffFloat {
        0% {
          opacity: 0;
          transform: translate(0, 0) scale(0.5);
        }
        25% {
          opacity: 0.5;
        }
        100% {
          opacity: 0;
          transform: translate(-70px, -14px) scale(1.5);
        }
      }
      .rider {
        animation: bob 2.8s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: 50% 100%;
      }
      .wheel-spin {
        animation: spin 1.15s linear infinite;
      }
      .road-line {
        animation: roadRun 1.1s linear infinite;
      }
      .wind {
        animation: windRun 1.4s linear infinite;
      }
      .dust {
        animation: puffFloat 2.1s ease-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
      .dust:nth-of-type(2) {
        animation-delay: 0.4s;
      }
      .dust:nth-of-type(3) {
        animation-delay: 0.8s;
      }
      @media (prefers-reduced-motion: reduce) {
        .rider,
        .wheel-spin,
        .road-line,
        .wind,
        .dust {
          animation: none;
        }
      }
    </style>
  </head>
