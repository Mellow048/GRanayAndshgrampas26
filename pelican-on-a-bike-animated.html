<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pelican on a Bike — animated SVG</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-content: center;
        justify-items: center;
        padding: 30px 18px;
        background: radial-gradient(120% 90% at 50% -10%, #3a2a24 0%, #1d1512 55%, #0e0a08 100%);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        color: #c4a894;
      }
      .card {
        width: min(1140px, 100%);
        border-radius: 24px;
        overflow: hidden;
        background: #ffd9a8;
        box-shadow:
          0 40px 80px -30px rgba(0, 0, 0, 0.9),
          0 0 0 1px rgba(255, 255, 255, 0.08),
          0 0 100px -35px rgba(255, 170, 90, 0.55);
      }
      svg {
        display: block;
        width: 100%;
        height: auto;
      }
      .caption {
        width: min(1140px, 100%);
        margin: 15px 2px 0;
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        font-size: 12px;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }
      .caption strong {
        color: #f6e7d6;
        font-weight: 600;
      }
      .caption span {
        color: #8b7264;
      }
      /* dust is the one thing on its own clock — it doesn't track the cranks */
      @keyframes puff {
        0% {
          opacity: 0;
          transform: translate(0, 0) scale(0.45);
        }
        22% {
          opacity: 0.45;
        }
        100% {
          opacity: 0;
          transform: translate(-78px, -16px) scale(1.55);
        }
      }
      .puff {
        animation: puff 2.1s ease-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
      .puff:nth-of-type(2) {
        animation-delay: 0.5s;
      }
      .puff:nth-of-type(3) {
        animation-delay: 1s;
      }
      @keyframes flap {
        0%,
        100% {
          transform: rotate(-22deg);
        }
        50% {
          transform: rotate(20deg);
        }
      }
      @keyframes drift {
        0%,
        100% {
          transform: translate(0, 0);
        }
        30% {
          transform: translate(38px, -30px);
        }
        55% {
          transform: translate(74px, 4px);
        }
        80% {
          transform: translate(30px, -16px);
        }
      }
      .butterfly {
        animation: drift 10s ease-in-out infinite;
      }
      .wingA,
      .wingB {
        animation: flap 0.26s ease-in-out infinite;
        transform-box: fill-box;
      }
      .wingA {
        transform-origin: 100% 40%;
      }
      .wingB {
        transform-origin: 0% 40%;
      }
      @media (prefers-reduced-motion: reduce) {
        .puff {
          animation: none;
          opacity: 0;
        }
        .butterfly,
        .wingA,
        .wingB {
          animation: none;
        }
      }
    </style>
  </head>

    <p class="caption">
      <strong>Pelican on a Bike</strong>
      <span>two-bone IK legs · hand-built svg · no libraries</span>
    </p>

    <script>
      (() => {
        "use strict";
        const $ = (id) => document.getElementById(id);
        const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        const parts = {};
        [
          "rig", "bill", "eyelid", "roadLine",
          "spokesRear", "spokesFront",
          "nearLeg", "nearLegInk", "nearFoot", "nearPedal", "nearCrank",
          "farLeg", "farLegInk", "farFoot", "farPedal", "farCrank"
        ].forEach((id) => (parts[id] = $(id)));

        /* ── rig geometry, in viewBox units ─────────────────────────── */
        const BB = { x: 535, y: 580 };        // bottom bracket
        const CRANK = 52;                      // crank arm length
        const HIP_NEAR = { x: 566, y: 398 };   // hip joints
        const HIP_FAR = { x: 542, y: 398 };
        const THIGH = 105;                     // bone lengths
        const SHIN = 135;
        const CADENCE = 1.2;                   // crank revs per second
        const GEAR = 1.25;                     // wheel revs per crank rev
        const ROAD_SPEED = 130;                // px per second

        /* Two-bone IK: given a hip and a foot, find the knee.
           The normal is chosen so the knee always bends forward (+x). */
        function kneeOf(hip, foot) {
          const dx = foot.x - hip.x;
          const dy = foot.y - hip.y;
          const raw = Math.hypot(dx, dy) || 1;
          const ux = dx / raw;
          const uy = dy / raw;
          const d = Math.min(Math.max(raw, Math.abs(THIGH - SHIN) + 1), THIGH + SHIN - 1);
          const a = (THIGH * THIGH - SHIN * SHIN + d * d) / (2 * d);
          const h = Math.sqrt(Math.max(0, THIGH * THIGH - a * a));
          // perpendicular to (ux,uy), rotated so it points forwards
          const nx = uy;
          const ny = -ux;
          return {
            x: hip.x + a * ux + h * nx,
            y: hip.y + a * uy + h * ny
          };
        }

        const fmt = (n) => n.toFixed(1);

        function drawLeg(inkEl, fillEl, hip, foot) {
          const k = kneeOf(hip, foot);
          const d =
            "M " + fmt(hip.x) + "," + fmt(hip.y) +
            " L " + fmt(k.x) + "," + fmt(k.y) +
            " L " + fmt(foot.x) + "," + fmt(foot.y);
          inkEl.setAttribute("d", d);
          fillEl.setAttribute("d", d);
        }

        const place = (el, x, y) => el.setAttribute("transform", "translate(" + fmt(x) + "," + fmt(y) + ")");

        const t0 = performance.now();
        let raf = 0;

        function frame(now) {
          const t = (now - t0) / 1000;
          const theta = t * Math.PI * 2 * CADENCE;

          // the body bobs twice per crank revolution, like a real rider
          const bob = Math.sin(theta * 2) * 2.2;

          // cranks: near and far pedals are always 180° apart
          const near = { x: BB.x + Math.cos(theta) * CRANK, y: BB.y + Math.sin(theta) * CRANK };
          const far = { x: BB.x - Math.cos(theta) * CRANK, y: BB.y - Math.sin(theta) * CRANK };

          const hipNear = { x: HIP_NEAR.x, y: HIP_NEAR.y + bob };
          const hipFar = { x: HIP_FAR.x, y: HIP_FAR.y + bob };

          drawLeg(parts.nearLeg, parts.nearLegInk, hipNear, near);
          drawLeg(parts.farLeg, parts.farLegInk, hipFar, far);

          place(parts.nearFoot, near.x, near.y);
          place(parts.farFoot, far.x, far.y);
          place(parts.nearPedal, near.x, near.y);
          place(parts.farPedal, far.x, far.y);

          parts.nearCrank.setAttribute("x2", fmt(near.x));
          parts.nearCrank.setAttribute("y2", fmt(near.y));
          parts.farCrank.setAttribute("x2", fmt(far.x));
          parts.farCrank.setAttribute("y2", fmt(far.y));

          // whole rider bobs; the hips above bob with it, so feet stay on the pedals
          parts.rig.setAttribute("transform", "translate(0 " + fmt(bob) + ")");

          // wheels roll clockwise as the bike travels right
          const deg = (t * 360 * CADENCE * GEAR) % 360;
          parts.spokesRear.setAttribute("transform", "rotate(" + fmt(deg) + " 370 556)");
          parts.spokesFront.setAttribute("transform", "rotate(" + fmt(deg) + " 790 556)");

          // road scrolls backwards, seamlessly (96 + 74 = 170px period)
          parts.roadLine.setAttribute("stroke-dashoffset", fmt(-((t * ROAD_SPEED) % 170)));

          // heavy bill swings a little on the bumps
          const swing = Math.sin(theta * 2 + 0.6) * 1.4;
          parts.bill.setAttribute(
            "transform",
            "rotate(" + fmt(swing) + " 696 172)"
          );

          // blink every few seconds
          const cyc = 4.6;
          const phase = t % cyc;
          const blinking = phase > cyc - 0.13;
          parts.eyelid.setAttribute("opacity", blinking ? "1" : "0");

          raf = requestAnimationFrame(frame);
        }

        // Pause when off-screen or when the tab is hidden, resume on return.
        const kick = () => {
          cancelAnimationFrame(raf);
          raf = requestAnimationFrame(frame);
        };

        if (!reduced) {
          kick();
          document.addEventListener("visibilitychange", () => {
            if (document.hidden) cancelAnimationFrame(raf);
            else kick();
          });
        }
      })();
    </script>
