<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pelican on a Bicycle — sunset ride</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    place-items: center;
    padding: clamp(10px, 3vw, 32px);
    background: #150f1d;
    background-image: radial-gradient(120% 100% at 50% 0%, #2a2038 0%, #150f1d 55%, #0c0812 100%);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .stage { width: min(1200px, 100%, calc((100vh - 64px) * 1.5)); }
  svg {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 18px;
    box-shadow: 0 30px 80px rgba(0, 0, 0, .6), 0 0 0 1px rgba(255, 255, 255, .06);
  }

  .cloud-a { animation: drift 64s linear infinite; }
  .cloud-b { animation: drift 46s linear infinite; animation-delay: -20s; }
  .cloud-c { animation: drift 80s linear infinite; animation-delay: -44s; }

  #roadDashes { animation: roll 1.15s linear infinite; }
  #waves { animation: surge 11s linear infinite; }

  #scarfTails {
    transform-origin: 604px 252px;
    animation: flutter .95s ease-in-out infinite;
  }
  #flag {
    transform-origin: 312px 354px;
    animation: flutter .8s ease-in-out infinite reverse;
  }
  #fishTail {
    transform-origin: 0 0;
    animation: wiggle 2.6s ease-in-out infinite;
  }
  #eye { transform-origin: 734px 190px; animation: blink 6.8s ease-in-out infinite; }
  #lampGlow { animation: glow 3.4s ease-in-out infinite; }

  @keyframes drift   { from { transform: translateX(80px); }  to { transform: translateX(-320px); } }
  @keyframes roll    { from { transform: translateX(0); }     to { transform: translateX(-180px); } }
  @keyframes surge   { from { transform: translateX(0); }     to { transform: translateX(-46px); } }
  @keyframes flutter { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(6deg); } }
  @keyframes wiggle  { 0%, 74%, 100% { transform: rotate(8deg); }
                       80% { transform: rotate(-7deg); }
                       86% { transform: rotate(16deg); }
                       92% { transform: rotate(2deg); } }
  @keyframes blink   { 0%, 94%, 100% { transform: scaleY(1); } 96%, 98% { transform: scaleY(.08); } }
  @keyframes glow    { 0%, 100% { opacity: .5; } 50% { opacity: .85; } }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }
</style>
</head>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)');

  const BB = { x: 555, y: 672 };
  const CRANK = 50;
  const HIP_NEAR = [524, 416];
  const HIP_FAR  = [504, 410];
  const L_THIGH = 160;
  const L_SHIN  = 170;
  const CADENCE = 0.75;
  const ANGLE0  = 1.0;
  const WHEEL_REAR  = { x: 320, y: 672 };
  const WHEEL_FRONT = { x: 810, y: 672 };

  const els = {
    rear: $('rearWheel'), front: $('frontWheel'), ring: $('chainring'),
    armN: $('crankNear'), armNin: $('crankNearInk'), armF: $('crankFar'),
    pedalN: $('pedalNear'), pedalF: $('pedalFar'),
    footN: $('footNear'), footF: $('footFar'),
    thighN: $('legNearThigh'), shinN: $('legNearShin'), kneeN: $('kneeNear'),
    thighNi: $('legNearThighInk'), shinNi: $('legNearShinInk'), kneeNi: $('kneeNearInk'),
    thighF: $('legFarThigh'), shinF: $('legFarShin'),
    thighFi: $('legFarThighInk'), shinFi: $('legFarShinInk'),
    rider: $('rider')
  };

  /* two-bone IK: keeps each webbed foot pinned to its pedal */
  function solveKnee(hx, hy, px, py) {
    let dx = px - hx, dy = py - hy;
    let d = Math.hypot(dx, dy) || 1;
    const reach = L_THIGH + L_SHIN - 0.4;
    if (d > reach) { dx *= reach / d; dy *= reach / d; d = reach; }
    if (d < 1) d = 1;
    const ux = dx / d, uy = dy / d;
    const a = (L_THIGH * L_THIGH - L_SHIN * L_SHIN + d * d) / (2 * d);
    const h = Math.sqrt(Math.max(0, L_THIGH * L_THIGH - a * a));
    return {
      kx: hx + ux * a + uy * h,
      ky: hy + uy * a - ux * h,
      px: hx + dx,
      py: hy + dy
    };
  }

  function placeLeg(thighEl, shinEl, footEl, hip, pedal, kneeEl, thighInk, shinInk, kneeInk) {
    const j = solveKnee(hip[0], hip[1], pedal.x, pedal.y);
    const thigh = `M${hip[0]} ${hip[1]} L${j.kx.toFixed(1)} ${j.ky.toFixed(1)}`;
    const shin = `M${j.kx.toFixed(1)} ${j.ky.toFixed(1)} L${j.px.toFixed(1)} ${j.py.toFixed(1)}`;
    thighEl.setAttribute('d', thigh);
    shinEl.setAttribute('d', shin);
    if (thighInk) thighInk.setAttribute('d', thigh);
    if (shinInk) shinInk.setAttribute('d', shin);
    footEl.setAttribute('transform', `translate(${j.px.toFixed(1)} ${(j.py - 9).toFixed(1)})`);
    for (const disc of [kneeEl, kneeInk]) {
      if (!disc) continue;
      disc.setAttribute('cx', j.kx.toFixed(1));
      disc.setAttribute('cy', j.ky.toFixed(1));
    }
  }

  let clock = 0;
  let last = 0;

  function render(now) {
    if (!last) last = now;
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!reduce.matches) clock += dt;

    const ang = ANGLE0 + clock * Math.PI * 2 * CADENCE;
    const deg = ang * 180 / Math.PI;

    const pedalN = { x: BB.x + CRANK * Math.cos(ang), y: BB.y + CRANK * Math.sin(ang) };
    const pedalF = { x: BB.x - CRANK * Math.cos(ang), y: BB.y - CRANK * Math.sin(ang) };

    els.rear.setAttribute('transform', `translate(${WHEEL_REAR.x} ${WHEEL_REAR.y}) rotate(${(deg * 2.6).toFixed(1)})`);
    els.front.setAttribute('transform', `translate(${WHEEL_FRONT.x} ${WHEEL_FRONT.y}) rotate(${(deg * 2.6).toFixed(1)})`);

    els.ring.setAttribute('transform', `rotate(${deg.toFixed(1)})`);

    for (const arm of [els.armN, els.armNin]) {
      arm.setAttribute('x1', BB.x); arm.setAttribute('y1', BB.y);
      arm.setAttribute('x2', pedalN.x.toFixed(1));
      arm.setAttribute('y2', pedalN.y.toFixed(1));
    }
    els.armF.setAttribute('x1', BB.x); els.armF.setAttribute('y1', BB.y);
    els.armF.setAttribute('x2', pedalF.x.toFixed(1));
    els.armF.setAttribute('y2', pedalF.y.toFixed(1));

    els.pedalN.setAttribute('transform', `translate(${pedalN.x.toFixed(1)} ${pedalN.y.toFixed(1)})`);
    els.pedalF.setAttribute('transform', `translate(${pedalF.x.toFixed(1)} ${pedalF.y.toFixed(1)})`);

    placeLeg(els.thighN, els.shinN, els.footN, HIP_NEAR, pedalN, els.kneeN, els.thighNi, els.shinNi, els.kneeNi);
    placeLeg(els.thighF, els.shinF, els.footF, HIP_FAR, pedalF, null, els.thighFi, els.shinFi, null);

    const bob = Math.sin(clock * Math.PI * 2 * CADENCE * 2) * 2;
    els.rider.setAttribute('transform', `translate(0 ${bob.toFixed(2)})`);

    if (!reduce.matches) requestAnimationFrame(render);
  }

  requestAnimationFrame(render);
})();
</script>
