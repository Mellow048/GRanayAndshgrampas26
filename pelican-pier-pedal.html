<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pier Pedal — a pelican on a bicycle</title>
<style>
  html, body {
    margin: 0;
    min-height: 100%;
    background: #0a2233;
    display: grid;
    place-items: center;
    overflow: hidden;
    font-family: ui-rounded, "Segoe UI", system-ui, sans-serif;
  }
  svg.scene {
    width: min(100vw, 177.7vh);
    height: auto;
    display: block;
    border-radius: 16px;
    box-shadow: 0 26px 80px rgba(3, 18, 30, 0.6);
  }

  /* ---- wheels and cranks ------------------------------------------------ */
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes spinBack { to { transform: rotate(-360deg); } }

  .wheel {
    transform-box: fill-box;
    transform-origin: center;
    animation: spin 1.05s linear infinite;
  }
  .crank {
    transform-box: fill-box;
    transform-origin: center;
    animation: spin 1.3s linear infinite;
  }
  .pedal {
    transform-box: fill-box;
    transform-origin: center;
    animation: spinBack 1.3s linear infinite;
  }
  .chain {
    animation: chainRoll 0.9s linear infinite;
  }
  @keyframes chainRoll { to { stroke-dashoffset: -24; } }

  /* ---- legs swing with the pedals -------------------------------------- */
  .leg {
    transform-origin: 512px 326px;
    animation: legSwing 1.3s ease-in-out infinite;
  }
  .leg-far {
    transform-origin: 506px 320px;
    animation: legSwing 1.3s ease-in-out infinite reverse;
  }
  @keyframes legSwing {
    0%, 100% { transform: rotate(-7deg); }
    50%      { transform: rotate(7deg); }
  }

  /* ---- the rider bobs -------------------------------------------------- */
  .bob { animation: bob 0.65s ease-in-out infinite; }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-4px); }
  }

  /* ---- scarf / pennant / wing flaps ------------------------------------ */
  .flutter { transform-box: fill-box; transform-origin: 0% 50%; animation: flutter 0.62s ease-in-out infinite; }
  .flutter-2 { transform-box: fill-box; transform-origin: 0% 50%; animation: flutter 0.62s ease-in-out infinite 0.14s; }
  @keyframes flutter {
    0%, 100% { transform: rotate(-8deg) skewY(4deg); }
    50%      { transform: rotate(7deg) skewY(-5deg); }
  }

  /* ---- blinking -------------------------------------------------------- */
  .eye { transform-box: fill-box; transform-origin: center; animation: blink 4.6s infinite; }
  @keyframes blink {
    0%, 92%, 100% { transform: scaleY(1); }
    95%           { transform: scaleY(0.08); }
  }

  /* ---- sea sparkle ----------------------------------------------------- */
  .glint { animation: glint 2.8s ease-in-out infinite; }
  @keyframes glint {
    0%, 100% { opacity: 0.15; }
    50%      { opacity: 0.95; }
  }

  /* ---- sun rays -------------------------------------------------------- */
  .rays { transform-box: fill-box; transform-origin: center; animation: spin 48s linear infinite; }

  /* ---- hot air balloon drift (pure CSS parallax) ----------------------- */
  .drift { animation: drift 34s linear infinite; }
  @keyframes drift {
    from { transform: translateX(0); }
    to   { transform: translateX(-1500px); }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }
</style>
</head>
<body>
<svg class="scene" viewBox="0 0 1200 675" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Pier Pedal</title>
  <desc id="dsc">A cartoon pelican in a straw hat rides a turquoise bicycle along a sunny seaside boardwalk, with a baguette in the front basket, a pennant fluttering behind, gulls overhead and a butterfly keeping pace.</desc>

      <stop offset="1" stop-color="#bd7f47" />

    <radialGradient id="sunGlow">

    <linearGradient id="beak" x1="0" y1="0" x2="1" y2="0">

      <line x1="600"  y1="520" x2="600"  y2="675" />
      <line x1="740"  y1="520" x2="740"  y2="675" />
      <line x1="880"  y1="520" x2="880"  y2="675" />

    <!-- one tile of wave crests -->

      <path d="M-10 412 q 26 -10 52 0 t 52 0 t 52 0 t 52 0 t 52 0 t 52 0 t 52 0 t 52 0 t 52 0 t 52 0 t 52 0 t 52 0 t 52 0 t 52 0 t 52 0 t 52 0 t 52 0 t 52 0 t 52 0 t 52 0 t 52 0 t 52 0 t 52 0" opacity="0.8" />
    </g>
  </defs>

  <!-- ============================ SKY ============================ -->

  <!-- sun -->

      <line x1="910"  y1="104" x2="880"  y2="104" />
      <line x1="1140" y1="104" x2="1110" y2="104" />

      <line x1="940"  y1="174" x2="919"  y2="195" />

  <!-- clouds drifting -->

  <g class="drift" style="animation-duration:19s">

  <g fill="#eafcff">

  <!-- dune grass -->
  <g fill="#a9c86a" stroke="#6f8c3c" stroke-width="2.5">
    <path d="M96 470 q 6 -34 18 -46 q 4 26 -2 46 z" />
    <path d="M124 474 q 10 -28 24 -36 q 0 22 -8 36 z" />
    <path d="M948 484 q 8 -32 22 -42 q 2 26 -6 42 z" />
    <path d="M986 488 q 10 -26 24 -34 q 0 22 -8 34 z" />
  </g>

  <!-- ============================ BOARDWALK ============================ -->
  <rect x="0" y="520" width="1200" height="155" fill="url(#boards)" />
  <rect x="0" y="520" width="1200" height="8" fill="#efc48c" />

    <use href="#boardTile" x="1200" />
  </g>

  <!-- ============================ RIDER ============================ -->
  <g class="bob">
    <!-- contact shadow -->
    <ellipse cx="600" cy="545" rx="250" ry="16" fill="#6b3f1d" opacity="0.28" filter="url(#soft)" />

    <!-- wheels -->
    <g class="wheel">
      <circle cx="400" cy="455" r="86" fill="none" stroke="#243044" stroke-width="14" />

        <line x1="854" y1="401" x2="746" y2="509" />

    <!-- frame -->

        <path d="M712 338 L 800 455" />
        <path d="M400 455 L 492 350" />
      </g>
      <!-- chainring + chain -->

      <path d="M560 436 L 400 455" stroke="#6b7a94" stroke-width="4" stroke-dasharray="6 6" class="chain" />
      <path d="M560 480 L 400 455" stroke="#6b7a94" stroke-width="4" stroke-dasharray="6 6" class="chain" opacity="0.75" />

      <g stroke="#b98a3e" stroke-width="3" stroke-linecap="round">

        <path d="M38 22 q 10 -12 24 -14" />

        <path d="M36 40 l -5 40" />

        <path d="M84 40 l 5 40" />
