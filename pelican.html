<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pelican on a Bicycle</title>
<style>
  :root {
    --ink: #26333d;
    --paper: #f6efe3;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 32px 20px 44px;
    background:
      radial-gradient(1200px 620px at 50% -10%, #ffffff 0%, rgba(255,255,255,0) 60%),
      linear-gradient(160deg, #f7f3ea 0%, #efe6d6 55%, #e6dac6 100%);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
  }
  .frame {
    width: min(1060px, 100%);
    border-radius: 22px;
    overflow: hidden;
    background: #fff;
    box-shadow:
      0 2px 4px rgba(38, 51, 61, .06),
      0 18px 40px -12px rgba(38, 51, 61, .22),
      0 40px 80px -40px rgba(38, 51, 61, .35);
  }
  svg { display: block; width: 100%; height: auto; }

  .caption {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    width: min(1060px, 100%);
    padding: 0 4px;
  }
  .caption h1 {
    margin: 0;
    font-size: 15px;
    font-weight: 650;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: #5c6b76;
  }
  .caption p { margin: 0; font-size: 13px; color: #8a949d; }
  .save {
    appearance: none;
    border: 1px solid #d9cdb8;
    background: #fffdf8;
    color: #4a5560;
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .04em;
    padding: 9px 16px;
    border-radius: 999px;
    cursor: pointer;
    transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
    box-shadow: 0 1px 2px rgba(38,51,61,.08);
  }
  .save:hover { background: #fff; box-shadow: 0 4px 12px -2px rgba(38,51,61,.22); transform: translateY(-1px); }
  .save:active { transform: translateY(0); }

  @media (prefers-reduced-motion: reduce) {
    .drift { animation: none !important; }
  }
  .drift { animation: drift 26s ease-in-out infinite alternate; }
  .drift.slow { animation-duration: 38s; animation-direction: alternate-reverse; }
  @keyframes drift {
    from { transform: translateX(-18px); }
    to   { transform: translateX(22px); }
  }
</style>
</head>
<body>

<div class="frame">
<svg id="art" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg">
  <title id="title">Pelican riding a bicycle</title>
  <desc id="desc">A cream-white pelican in side profile rides a teal bicycle, leaning forward with one wing on the handlebars and a webbed orange foot on the pedal, its long bill and pouch angled ahead, against a soft coastal backdrop.</desc>

  <defs>
    <!-- sky + land -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#dceefb"/>
      <stop offset="0.55" stop-color="#eaf5fb"/>
      <stop offset="1"   stop-color="#fdf6ec"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#fff3c9" stop-opacity=".95"/>
      <stop offset="0.55" stop-color="#ffe8ab" stop-opacity=".45"/>
      <stop offset="1"   stop-color="#ffe8ab" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0e2c9"/>
      <stop offset="1" stop-color="#dfcdae"/>
    </linearGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe2dc"/>
      <stop offset="1" stop-color="#dbebe4"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bcd6c9"/>
      <stop offset="1" stop-color="#cde2d7"/>
    </linearGradient>
    <radialGradient id="contactShadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#8b7a5e" stop-opacity=".34"/>
      <stop offset="0.65" stop-color="#8b7a5e" stop-opacity=".12"/>
      <stop offset="1"   stop-color="#8b7a5e" stop-opacity="0"/>
    </radialGradient>

    <!-- pelican plumage -->
    <linearGradient id="plume" x1="0.15" y1="0" x2="0.75" y2="1">
      <stop offset="0"   stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#fbf5ea"/>
      <stop offset="1"   stop-color="#e9decd"/>
    </linearGradient>
    <linearGradient id="plumeFar" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0"   stop-color="#dfd5c6"/>
      <stop offset="1"   stop-color="#cbc0b0"/>
    </linearGradient>
    <linearGradient id="plumeShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#dccebb" stop-opacity="0"/>
      <stop offset="1"   stop-color="#cbbca5" stop-opacity=".85"/>
    </linearGradient>
    <linearGradient id="billGrad" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0"   stop-color="#ffc95e"/>
      <stop offset="0.5" stop-color="#f2a63a"/>
      <stop offset="1"   stop-color="#dd8a25"/>
    </linearGradient>
    <linearGradient id="pouchGrad" x1="0.1" y1="0" x2="0.5" y2="1">
      <stop offset="0"   stop-color="#ffcf7d"/>
      <stop offset="0.55" stop-color="#f7ae4e"/>
      <stop offset="1"   stop-color="#e3912f"/>
    </linearGradient>
    <linearGradient id="legGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3ad4d"/>
      <stop offset="1" stop-color="#dc8b2b"/>
    </linearGradient>

    <!-- bicycle -->
    <linearGradient id="frame" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0"   stop-color="#3f8fae"/>
      <stop offset="0.5" stop-color="#266b88"/>
      <stop offset="1"   stop-color="#1b546d"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3e9ef"/>
      <stop offset="1" stop-color="#aab6c1"/>
    </linearGradient>
    <linearGradient id="leather" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#a06a44"/>
      <stop offset="1" stop-color="#6f4429"/>
    </linearGradient>

    <clipPath id="pouchClip">
      <path d="M546 126 C 596 142 650 156 704 153 C 700 171 684 189 660 198
               C 632 208 594 202 570 182 C 553 168 544 148 546 126 Z"/>
    </clipPath>
    <clipPath id="wheelClipRear"><circle cx="300" cy="492" r="86"/></clipPath>
    <clipPath id="wheelClipFront"><circle cx="650" cy="492" r="86"/></clipPath>
  </defs>

  <!-- ============================ BACKGROUND ============================ -->
  <rect width="1000" height="700" fill="url(#sky)"/>

  <!-- sun -->
  <circle cx="852" cy="112" r="118" fill="url(#sunGlow)"/>
  <circle cx="852" cy="112" r="42" fill="#fff6d8" opacity=".92"/>
  <circle cx="852" cy="112" r="42" fill="none" stroke="#fff9e6" stroke-width="2" opacity=".8"/>

  <!-- clouds -->
  <g fill="#ffffff" opacity=".72">
    <g class="drift">
      <path d="M120 148c0-14 12-25 27-25 4-15 18-26 35-26 16 0 30 10 35 24 3-1 6-2 9-2 13 0 24 11 24 24 0 3-1 6-2 8H124c-3-1-4-2-4-3z"/>
    </g>
    <g class="drift slow" opacity=".78">
      <path d="M640 96c0-11 9-20 21-20 3-12 14-21 27-21 13 0 24 8 28 19 2-1 5-1 7-1 10 0 19 8 19 19 0 2-1 5-2 7H643c-2-1-3-2-3-3z"/>
    </g>
    <g class="drift slow" opacity=".5">
      <path d="M420 74c0-9 7-16 17-16 2-10 11-17 21-17 11 0 19 7 22 16 2-1 4-1 6-1 8 0 14 7 14 15 0 2 0 4-1 5H423c-2 0-3-1-3-2z"/>
    </g>
  </g>

  <!-- distant coastline -->
  <path d="M0 470c70-26 128-8 196-22 66-13 108-34 176-30 74 4 116 34 196 30 78-4 132-30 210-30 78 0 152 20 222 12v70H0z" fill="url(#hillFar)"/>
  <path d="M0 500c86-20 132 4 208-6 74-10 110-26 178-20 70 6 108 30 184 24 78-6 120-24 198-20 80 4 150 18 232 10v52H0z" fill="url(#hillNear)" opacity=".9"/>

  <!-- ground -->
  <path d="M0 552c168-18 322 10 500 6s332-26 500-6v148H0z" fill="url(#ground)"/>
  <path d="M0 552c168-18 322 10 500 6s332-26 500-6" fill="none" stroke="#e5d5b8" stroke-width="3"/>
  <!-- ground speckle -->
  <g fill="#cdb995" opacity=".55">
    <circle cx="152" cy="632" r="3"/><circle cx="214" cy="660" r="2.4"/>
    <circle cx="286" cy="620" r="2"/><circle cx="392" cy="654" r="2.8"/>
    <circle cx="470" cy="628" r="2"/><circle cx="602" cy="662" r="2.6"/>
    <circle cx="676" cy="622" r="2.2"/><circle cx="762" cy="648" r="3"/>
    <circle cx="864" cy="626" r="2.2"/><circle cx="512" cy="676" r="2"/>
  </g>

  <!-- contact shadow -->
  <ellipse cx="480" cy="590" rx="252" ry="26" fill="url(#contactShadow)"/>
  <ellipse cx="300" cy="586" rx="104" ry="15" fill="url(#contactShadow)"/>
  <ellipse cx="650" cy="586" rx="104" ry="15" fill="url(#contactShadow)"/>

  <!-- ============================ FAR SIDE: leg + crank ============================ -->
  <g>
    <!-- far crank arm (opposite to the near one) -->
    <line x1="455" y1="500" x2="417" y2="461" stroke="#7d8b96" stroke-width="8" stroke-linecap="round"/>
    <rect x="396" y="453" width="38" height="9" rx="4" fill="#5a6873" transform="rotate(-42 415 457)"/>
    <!-- far leg: hip -> knee -> ankle, bird-like zigzag -->
    <path d="M424 318 L474 428 L434 459" fill="none" stroke="#cf7f28" stroke-width="12.5"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M424 318 L470 420" fill="none" stroke="#e29a41" stroke-width="3.4" opacity=".45" stroke-linecap="round"/>
    <path d="M428 448 C 422 452 418 458 419 463 L 413 468 C 423 470 436 471 444 470 L 450 465
             C 444 459 436 452 431 448 Z" fill="#d98a2f"/>
  </g>

  <!-- ============================ BICYCLE ============================ -->
  <g id="bicycle">
    <!-- rear wheel -->
    <g>
      <circle cx="300" cy="492" r="90" fill="none" stroke="#2b333b" stroke-width="10"/>
      <circle cx="300" cy="492" r="84" fill="none" stroke="#414c56" stroke-width="2" opacity=".55"/>
      <circle cx="300" cy="492" r="82" fill="none" stroke="url(#rim)" stroke-width="4"/>
      <g stroke="#a3aeb9" stroke-width="1.7" opacity=".95">
        <path d="M 311.9 493.2 L 387.6 500.8 M 310.2 498.3 L 375.1 537.9 M 306.5 502.1 L 347.7 565.9 M 301.5 503.9 L 310.9 579.3 M 296.2 503.4 L 272.0 575.4 M 291.6 500.6 L 238.5 555.0 M 288.7 496.1 L 217.3 522.1 M 288.1 490.8 L 212.4 483.2 M 289.8 485.7 L 224.9 446.1 M 293.5 481.9 L 252.3 418.1 M 298.5 480.1 L 289.1 404.7 M 303.8 480.6 L 328.0 408.6 M 308.4 483.4 L 361.5 429.0 M 311.3 487.9 L 382.7 461.9"/>
      </g>
      <g clip-path="url(#wheelClipRear)">
        <path d="M300 386 a106 106 0 0 1 74 30" fill="none" stroke="#ffffff" stroke-width="9" opacity=".35"/>
        <path d="M300 384 a108 108 0 0 0 -76 32" fill="none" stroke="#1b252c" stroke-width="7" opacity=".18"/>
      </g>
      <circle cx="300" cy="492" r="13" fill="#8e9aa5"/>
      <circle cx="300" cy="492" r="7" fill="#5c6873"/>
      <circle cx="298" cy="490" r="2.4" fill="#c9d2da"/>
    </g>

    <!-- front wheel -->
    <g>
      <circle cx="650" cy="492" r="90" fill="none" stroke="#2b333b" stroke-width="10"/>
      <circle cx="650" cy="492" r="84" fill="none" stroke="#414c56" stroke-width="2" opacity=".55"/>
      <circle cx="650" cy="492" r="82" fill="none" stroke="url(#rim)" stroke-width="4"/>
      <g stroke="#a3aeb9" stroke-width="1.7" opacity=".95">
        <path d="M 661.4 495.8 L 733.5 519.7 M 658.6 500.3 L 713.2 553.2 M 654.2 503.3 L 680.4 574.6 M 648.9 503.9 L 641.6 579.6 M 643.8 502.3 L 604.4 567.3 M 639.9 498.6 L 576.3 540.0 M 638.1 493.5 L 562.7 503.3 M 638.6 488.2 L 566.5 464.3 M 641.4 483.7 L 586.8 430.8 M 645.8 480.7 L 619.6 409.4 M 651.1 480.1 L 658.4 404.4 M 656.2 481.7 L 695.6 416.7 M 660.1 485.4 L 723.7 444.0 M 661.9 490.5 L 737.3 480.7"/>
      </g>
      <g clip-path="url(#wheelClipFront)">
        <path d="M650 386 a106 106 0 0 1 74 30" fill="none" stroke="#ffffff" stroke-width="9" opacity=".35"/>
        <path d="M650 384 a108 108 0 0 0 -76 32" fill="none" stroke="#1b252c" stroke-width="7" opacity=".18"/>
      </g>
      <circle cx="650" cy="492" r="13" fill="#8e9aa5"/>
      <circle cx="650" cy="492" r="7" fill="#5c6873"/>
      <circle cx="648" cy="490" r="2.4" fill="#c9d2da"/>
    </g>

    <!-- chain -->
    <path d="M 453.8 473 L 299.5 480 A 12 12 0 1 1 298.2 503.9 L 451.0 526.7 A 27 27 0 1 0 453.8 473 Z"
          fill="none" stroke="#5d6a75" stroke-width="5" stroke-linejoin="round"/>
    <path d="M 453.8 473 L 299.5 480 A 12 12 0 1 1 298.2 503.9 L 451.0 526.7 A 27 27 0 1 0 453.8 473 Z"
          fill="none" stroke="#9aa6b1" stroke-width="2" stroke-dasharray="3 4"/>

    <!-- rear cog -->
    <circle cx="300" cy="492" r="12" fill="none" stroke="#77838e" stroke-width="5" stroke-dasharray="3 3"/>

    <!-- frame: dark body then lighter tubes on top -->
    <g stroke-linecap="round" fill="none">
      <path d="M 455 500 L 398 342" stroke="#1b546d" stroke-width="14"/>
      <path d="M 455 500 L 600 447" stroke="#1b546d" stroke-width="15"/>
      <path d="M 398 342 L 583 332" stroke="#1b546d" stroke-width="13"/>
      <path d="M 583 332 L 612 452" stroke="#1b546d" stroke-width="16"/>
      <path d="M 300 492 L 455 500" stroke="#1b546d" stroke-width="10"/>
      <path d="M 300 492 L 398 342" stroke="#1b546d" stroke-width="9"/>
      <path d="M 612 452 C 622 470 636 482 650 492" stroke="#1b546d" stroke-width="11"/>

      <path d="M 455 500 L 398 342" stroke="url(#frame)" stroke-width="9"/>
      <path d="M 455 500 L 600 447" stroke="url(#frame)" stroke-width="10"/>
      <path d="M 398 342 L 583 332" stroke="url(#frame)" stroke-width="8"/>
      <path d="M 583 332 L 612 452" stroke="url(#frame)" stroke-width="11"/>
      <path d="M 300 492 L 455 500" stroke="url(#frame)" stroke-width="6"/>
      <path d="M 300 492 L 398 342" stroke="url(#frame)" stroke-width="5.5"/>
      <path d="M 612 452 C 622 470 636 482 650 492" stroke="url(#frame)" stroke-width="7"/>
      <g stroke="#7cc3dc" stroke-width="1.6" opacity=".6">
        <path d="M 452 484 L 402 348"/>
        <path d="M 461 492 L 590 448"/>
        <path d="M 398 338 L 578 328"/>
      </g>
    </g>

    <!-- bottom bracket + chainring -->
    <circle cx="455" cy="500" r="27" fill="none" stroke="#77838e" stroke-width="7" stroke-dasharray="4.5 3.6"/>
    <circle cx="455" cy="500" r="24" fill="#c2cbd3"/>
    <circle cx="455" cy="500" r="24" fill="none" stroke="#8d99a4" stroke-width="2"/>
    <g stroke="#8d99a4" stroke-width="3" stroke-linecap="round">
      <path d="M455 482 v-10"/><path d="M455 518 v10"/>
      <path d="M437 498 h-10"/><path d="M473 502 h10"/>
    </g>
    <circle cx="455" cy="500" r="7" fill="#6d7984"/>

    <!-- near crank arm -->
    <line x1="455" y1="500" x2="494" y2="538" stroke="#cfd8e0" stroke-width="9" stroke-linecap="round"/>
    <rect x="472" y="532" width="44" height="10" rx="4.5" fill="#3f4b55"/>

    <!-- seatpost + saddle -->
    <path d="M 398 342 L 391 322" stroke="#aeb9c3" stroke-width="9" stroke-linecap="round"/>
    <path d="M 352 320 C 362 309 390 305 410 308 C 430 311 441 317 436 323 C 429 331 396 333 370 329 C 355 327 346 325 352 320 Z"
          fill="url(#leather)"/>
    <path d="M 362 315 C 374 309 396 307 414 310" fill="none" stroke="#c98d61" stroke-width="2.4" opacity=".8"/>
    <path d="M 356 316 C 366 322 386 326 406 325" fill="none" stroke="#4d2f1c" stroke-width="2" opacity=".55"/>

    <!-- stem + handlebar -->
    <path d="M 583 332 L 597 318" stroke="#aeb9c3" stroke-width="9" stroke-linecap="round"/>
    <path d="M 597 318 C 612 311 630 312 639 320 C 648 328 646 344 635 349"
          fill="none" stroke="#2b333b" stroke-width="9" stroke-linecap="round"/>
    <path d="M 597 318 C 612 311 630 312 639 320" fill="none" stroke="#5f6b76" stroke-width="3" opacity=".5"/>
    <path d="M 635 349 C 626 353 618 350 616 343" fill="none" stroke="#3f4b55" stroke-width="11" stroke-linecap="round"/>
    <path d="M 630 322 C 638 330 641 336 640 342" fill="none" stroke="#96a2ad" stroke-width="3.4" stroke-linecap="round"/>
    <g>
      <circle cx="607" cy="309" r="7.5" fill="#e9b646"/>
      <circle cx="607" cy="309" r="7.5" fill="none" stroke="#c48f24" stroke-width="1.4"/>
      <path d="M603 305 a5 5 0 0 1 6-1" fill="none" stroke="#fff2cc" stroke-width="1.6" stroke-linecap="round"/>
    </g>
  </g>

  <!-- ============================ PELICAN ============================ -->
  <g id="pelican">
    <!-- tail: short rounded feathers tucked behind the body -->
    <path d="M374 288 C 350 294 322 290 302 278 C 324 274 342 264 352 250
             C 356 240 362 232 370 228 C 388 242 406 248 422 246
             C 414 268 398 282 374 288 Z" fill="#f1e6d5"/>
    <path d="M378 282 C 358 287 336 283 320 275 C 338 270 350 262 358 252
             C 362 268 368 277 378 282 Z" fill="#fbf6ec" opacity=".9"/>
    <g fill="none" stroke="#dccfbc" stroke-width="1.5" opacity=".5" stroke-linecap="round">
      <path d="M370 278 C 354 279 338 275 322 269"/>
      <path d="M374 266 C 371 258 370 249 367 242"/>
    </g>

    <!-- neck first, so its base tucks behind the body -->
    <!-- neck: S-curve from the breast up into the back of the skull -->
    <path d="M458 242 C 448 202 464 162 500 146 C 510 141 518 138 524 137"
          fill="none" stroke="url(#plume)" stroke-width="34" stroke-linecap="round"/>
    <!-- nape highlight -->
    <path d="M448 222 C 442 190 456 158 484 143" fill="none" stroke="#ffffff" stroke-width="6"
          opacity=".45" stroke-linecap="round"/>

    <!-- rim light from the sun catching the back of the neck -->
    <path d="M524 140 C 512 143 502 150 494 162 C 484 180 476 200 468 220"
          fill="none" stroke="#fff6e2" stroke-width="5" opacity=".5" stroke-linecap="round"/>

    <!-- head -->
    <circle cx="531" cy="117" r="38" fill="url(#plume)"/>
    <!-- soft mass under the bird so the belly reads as resting on the bike -->
    <path d="M356 320 C 380 330 424 336 470 330" fill="none" stroke="#cbb9a1" stroke-width="10"
          opacity=".18" stroke-linecap="round"/>
    <!-- shadow the bird casts onto the saddle -->
    <ellipse cx="404" cy="330" rx="52" ry="14" fill="#8a6a4a" opacity=".18"/>

    <!-- body on top of the neck base -->
    <!-- body -->
    <path d="M504 204 C 526 240 522 284 500 316 C 478 346 434 358 394 350
             C 358 343 338 320 342 292 C 346 260 370 234 402 218
             C 430 203 458 196 478 190 C 492 186 499 192 504 204 Z"
          fill="url(#plume)"/>
    <!-- underside shading -->
    <path d="M500 316 C 478 346 434 358 394 350 C 358 343 338 320 342 292
             C 360 318 396 328 428 320 C 460 312 488 298 500 316 Z" fill="url(#plumeShade)" opacity=".5"/>
    <!-- soft breast light -->
    <path d="M492 226 C 508 254 504 288 486 308" fill="none" stroke="#ffffff" stroke-width="10"
          opacity=".55" stroke-linecap="round"/>
    <!-- flank feather scallops (subtle) -->
    <g fill="none" stroke="#ded1bd" stroke-width="1.6" opacity=".4" stroke-linecap="round">
      <path d="M378 272 C 394 278 410 276 424 270"/>
      <path d="M374 290 C 392 297 410 297 426 290"/>
      <path d="M382 306 C 398 312 414 312 428 306"/>
    </g>

    <!-- ==================== BILL ==================== -->
    <g id="billGroup">
      <!-- pouch: the gular sac, hanging under the mandible and tapering to the tip -->
      <path d="M546 126 C 596 142 650 156 704 153 C 700 171 684 189 660 198
               C 632 208 594 202 570 182 C 553 168 544 148 546 126 Z" fill="url(#pouchGrad)"/>
      <g clip-path="url(#pouchClip)">
      <!-- sac volume: a lit fold across the middle -->
      <path d="M556 156 C 584 176 622 188 660 186" fill="none" stroke="#ffd79a" stroke-width="5"
            opacity=".4" stroke-linecap="round"/>
      <path d="M550 176 C 574 196 604 206 636 206" fill="none" stroke="#d9862b" stroke-width="2.4"
            opacity=".2" stroke-linecap="round"/>
      <path d="M548 160 C 562 184 584 200 610 206" fill="none" stroke="#c97e26" stroke-width="2"
            opacity=".14" stroke-linecap="round"/>
      <!-- shadow the mandible casts into the sac -->
      <path d="M546 126 C 596 142 650 156 704 153 C 702 166 694 176 684 180
               C 628 178 580 160 556 138 Z" fill="#c9781f" opacity=".22"/>
      <!-- bottom rim of the sac, with the lower mandible shimmering along it -->
      <path d="M660 198 C 684 189 700 171 704 153" fill="none" stroke="#b96f1c" stroke-width="2.2" opacity=".4"/>
      <path d="M572 196 C 598 206 626 208 648 200" fill="none" stroke="#ffd79a" stroke-width="3"
            opacity=".32" stroke-linecap="round"/>
      <!-- soft shadow at the very bottom of the sac -->
      <path d="M570 182 C 592 202 626 209 660 198 C 642 208 608 208 588 199 Z" fill="#c9781f" opacity=".16"/>
      </g>

      <!-- upper mandible: long, slim, slightly down-curved blade with a hooked tip -->
      <path d="M546 98 C 600 101 662 114 702 141 C 709 144 709 151 702 152
               C 650 156 596 142 546 126 Z" fill="url(#billGrad)"/>
      <!-- culmen ridge highlight -->
      <path d="M552 103 C 604 108 662 122 699 144" fill="none" stroke="#ffdc93" stroke-width="2.4"
            opacity=".85" stroke-linecap="round"/>
      <!-- cutting edge, crisp -->

<div class="caption">
  <h1>Pelican on a Bicycle</h1>
  <p>Hand-drawn in pure SVG &middot; 1000 &times; 700</p>
  <button class="save" id="save" type="button">Download SVG</button>
</div>

<script>
  // Save the inline artwork as a standalone .svg file.
  document.getElementById('save').addEventListener('click', function () {
    var svg = document.getElementById('art').cloneNode(true);
    svg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
    svg.setAttribute('width', '1000');
    svg.setAttribute('height', '700');
    svg.querySelectorAll('.drift').forEach(function (el) {
      el.removeAttribute('class');
      el.style.transform = 'translateX(0)';
    });
    var source = '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(svg);
    var blob = new Blob([source], { type: 'image/svg+xml;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'pelican-on-a-bicycle.svg';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  });
</script>
